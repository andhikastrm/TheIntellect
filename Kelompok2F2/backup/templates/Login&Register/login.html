<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Petricord</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='globals.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>

<body>
<div class="halaman-login">

    <!-- Background dekor -->
    <img class="bg-left" src="{{ url_for('static', filename='img/login_img/O in Petricord-01 8.svg') }}">
    <img class="bg-right" src="{{ url_for('static', filename='img/login_img/O in Petricord-01 7.svg') }}">

    <!-- Logo -->
    <div class="logo-petricord">
        <span class="logo-text">Petric</span>
        <img class="logo-o" src="{{ url_for('static', filename='img/login_img/O in Petricord-01 3.svg') }}">
        <span class="logo-text">rd</span>
    </div>

    <!-- Welcome text -->
    <div class="welcome-text">Selamat datang kembali, Cordian!</div>

    <!-- FORM LOGIN -->
    <form class="form-login" method="POST" action="/login">

        <!-- Badge icon -->
        <div class="icon-badge">
            <img src="{{ url_for('static', filename='img/login_img/icon-arrow.svg') }}">
        </div>

        <div class="form-inner">
            <div class="title">Masuk dengan email</div>

            <div class="input-group">
                <img class="input-icon" src="{{ url_for('static', filename='img/login_img/icon-messege.svg') }}">
                <input type="email" name="email" placeholder="Alamat email" required>
            </div>

            <div class="input-group">
                <img class="input-icon" src="{{ url_for('static', filename='img/login_img/icon-lock.svg') }}">
                <input id="login-pass" type="password" name="password" placeholder="Kata sandi" required>
                <img id="btn-eye-login" class="icon-eye" 
                     src="{{ url_for('static', filename='img/login_img/icon-eye.svg') }}"
                     onclick="togglePassword('login-pass', 'btn-eye-login')">
            </div>

            <a href="/forgot-password" class="lupa-sandi">Lupa kata sandi?</a>

            <button class="button-login" type="submit">Masuk</button>

            <div class="divider">
                <div class="line"></div>
                <span>Atau</span>
                <div class="line"></div>
            </div>

            <button type="button" class="button-google">
                <img src="{{ url_for('static', filename='img/login_img/icon-google.svg') }}">
                <span>Lanjutkan dengan Google</span>
            </button>

            <div class="footer-register">
                Belum punya akun?
                <a href="/register">Daftar sekarang</a>
            </div>
        </div>
    </form>
</div>

<script>
function togglePassword(inputId, iconId) {
    var input = document.getElementById(inputId);
    var icon = document.getElementById(iconId);
    input.type = input.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
