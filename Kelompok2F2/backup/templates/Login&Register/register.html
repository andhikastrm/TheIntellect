<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Petricord</title>

    <!-- Font Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Load CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='globals.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='register.css') }}">
</head>

<body>
    <div class="halaman-register">

        <!-- TOMBOL BACK (Path: img/register_img/...) -->
        <a href="/" class="button-back" title="Kembali ke Beranda">
            <img class="back-bg" src="{{ url_for('static', filename='img/register_img/Ellipse 4.svg') }}" alt="Back Background" />
            <img class="back-icon" src="{{ url_for('static', filename='img/register_img/icon-back.svg') }}" alt="Back Arrow" />
        </a>

        <!-- DECORATION (Path: img/register_img/...) -->
        <img class="o-in-petricord" src="{{ url_for('static', filename='img/register_img/O in Petricord-01 7.svg') }}" alt="Decoration 1" />
        <img class="img" src="{{ url_for('static', filename='img/register_img/O in Petricord-01 8.svg') }}" alt="Decoration 2" />

        <!-- LOGO (Path: img/register_img/...) -->
        <div class="logo-petricord">
            <div class="petric-rd">Petric&nbsp;&nbsp; rd</div>
            <img class="o-in-petricord-2" src="{{ url_for('static', filename='img/register_img/O in Petricord-01 3.svg') }}" alt="O Logo" />
        </div>

        <!-- TITLE -->
        <div class="text-wrapper">Saatnya bergabung menjadi Cordian!</div>

        <!-- FORM -->
        <form class="form-register" method="POST" action="/register">
            <div class="group-2">

                <p class="text-wrapper-3">Buat akun baru</p>

                <!-- Nama Depan -->
                <div class="input-group half-left">
                    <input class="input-field" type="text" name="nama_depan" placeholder="Nama depan" required>
                </div>

                <!-- Nama Belakang -->
                <div class="input-group half-right">
                    <input class="input-field" type="text" name="nama_belakang" placeholder="Nama belakang" required>
                </div>

                <!-- Email -->
                <div class="input-group full-width">
                    <img class="input-icon" src="{{ url_for('static', filename='img/register_img/icon-messege.svg') }}" alt="Email Icon" />
                    <input class="input-field with-icon" type="email" name="email" placeholder="Alamat email" required>
                </div>

                <!-- Password -->
                <div class="input-group full-width">
                    <img class="input-icon" src="{{ url_for('static', filename='img/register_img/Vector (1).svg') }}" alt="Lock Icon" />
                    
                    <input id="input-pass" class="input-field with-icon" type="password" name="password" placeholder="Buat kata sandi" required>
                    
                    <img id="btn-eye-pass" class="icon-eye" src="{{ url_for('static', filename='img/register_img/icon-eye.svg') }}" alt="Show Password" onclick="togglePassword('input-pass', 'btn-eye-pass')" />
                </div>

                <!-- Konfirmasi Password -->
                <div class="input-group full-width">
                    <img class="input-icon" src="{{ url_for('static', filename='img/register_img/Vector (1).svg') }}" alt="Lock Icon" />
                    
                    <input id="input-conf" class="input-field with-icon" type="password" name="konfirmasi" placeholder="Konfirmasi kata sandi" required>
                    
                    <img id="btn-eye-conf" class="icon-eye" src="{{ url_for('static', filename='img/register_img/icon-eye.svg') }}" alt="Show Password" onclick="togglePassword('input-conf', 'btn-eye-conf')" />
                </div>

                <!-- Tombol Submit -->
                <button class="button-register" type="submit">
                    Mulai sekarang!
                </button>

                <div class="sudah-punya-akun">
                    <span class="span">Sudah punya akun? Masuk di </span>
                    <a href="/login" class="text-wrapper-2">sini</a>
                </div>

            </div>
        </form>

    </div>

    <!-- Script -->
    <script>
        function togglePassword(inputId, iconId) {
            var input = document.getElementById(inputId);
            var icon = document.getElementById(iconId);
            
            if (input.type === "password") {
                input.type = "text";
                icon.style.opacity = "1"; 
            } else {
                input.type = "password";
                icon.style.opacity = "0.6";
            }
        }
    </script>

</body>
</html>
