<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Petricord - Profil Saya</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      background: linear-gradient(135deg, #fdfcfb, #e2e2ff);
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
    }

    .sidebar {
      width: 280px;
      background: white;
      box-shadow: 10px 0 30px rgba(0, 0, 0, 0.1);
      position: fixed;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 10;
    }

    .content {
      margin-left: 280px;
      padding: 40px;
    }

    .btn-gold {
      background: linear-gradient(45deg, #f59e0b, #d97706);
      color: white;
    }

    .btn-gold:hover {
      background: linear-gradient(45deg, #d97706, #b45309);
    }

    .profile-pic {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border: 6px solid #f59e0b;
    }

    .card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>

<body class="text-gray-800">

  <!-- SIDEBAR -->
  <div class="sidebar p-8 flex flex-col justify-between">
    <div>
      <h1 class="text-4xl font-bold text-amber-600 mb-12">Petricord</h1>
      <nav class="space-y-4">
        <a href="owner-dashboard.html"
          class="flex items-center gap-4 text-gray-600 hover:text-amber-600 py-3 px-4 rounded-xl transition">
          <i class="bi bi-house-door text-xl"></i> Perangkat
        </a>
        <a href="jurnal-hewan.html"
          class="flex items-center gap-4 text-gray-600 hover:text-amber-600 py-3 px-4 rounded-xl transition">
          <i class="bi bi-journal-text text-xl"></i> Jurnal Hewan
        </a>
        <a href="#" class="flex items-center gap-4 text-amber-600 bg-amber-50 py-3 px-4 rounded-xl font-bold">
          <i class="bi bi-person-circle text-xl"></i> Profil Saya
        </a>
        <a href="#" class="flex items-center gap-4 text-gray-600 hover:text-amber-600 py-3 px-4 rounded-xl transition">
          <i class="bi bi-bell text-xl"></i> Notifikasi
        </a>
        <a href="#" class="flex items-center gap-4 text-gray-600 hover:text-amber-600 py-3 px-4 rounded-xl transition">
          <i class="bi bi-clock-history text-xl"></i> Riwayat
        </a>
        <a href="#" class="flex items-center gap-4 text-gray-600 hover:text-amber-600 py-3 px-4 rounded-xl transition">
          <i class="bi bi-gear text-xl"></i> Pengaturan
        </a>
      </nav>
    </div>
    <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white py-4 rounded-full font-bold">
      Keluar
    </button>
  </div>

  <!-- MAIN CONTENT -->
  <div class="content max-w-5xl">
    <h2 class="text-4xl font-bold mb-2">Profil Saya</h2>
    <p class="text-gray-600 mb-10">Kelola akun dan tambah kucing kesayanganmu</p>

    <!-- Profil User -->
    <div class="card p-10 mb-10 flex items-center gap-10">
      <img id="userFoto" src="https://via.placeholder.com/150/ddd/999?text=You" alt="Foto Profil"
        class="rounded-full profile-pic">
      <div>
        <h3 id="userNama" class="text-3xl font-bold">Cordian</h3>
        <p id="userEmail" class="text-xl text-gray-600"></p>
        <p class="text-gray-500 mt-2">Anggota Petricord sejak <span id="joinDate">2025</span></p>
      </div>
    </div>

    <!-- Tambah Kucing -->
    <div class="card p-10">
      <div class="flex justify-between items-center mb-8">
        <div>
          <h3 class="text-2xl font-bold">Tambah Kucing Baru</h3>
          <p class="text-gray-600">Isi data kucingmu di sini</p>
        </div>
        <button onclick="openAddCatForm()"
          class="btn-gold px-8 py-4 rounded-full font-bold text-lg shadow-lg hover:shadow-xl transition">
          + Tambah Kucing
        </button>
      </div>

      <!-- Form akan muncul via SweetAlert -->
      <div class="text-center py-16 text-gray-400">
        <i class="bi bi-plus-circle-dotted text-6xl mb-4"></i>
        <p>Klik tombol di atas untuk menambah kucing baru</p>
      </div>
    </div>
  </div>

  <script>
    // Ambil data dari localStorage (dari login)
    const userName = localStorage.getItem("user_name") || "Cordian";
    const userEmail = localStorage.getItem("user_email") || "email@petricord.me";
    const userFoto = localStorage.getItem("user_foto") || "https://via.placeholder.com/150/ddd/999?text=You";

    document.getElementById("userNama").textContent = userName;
    document.getElementById("userEmail").textContent = userEmail;
    document.getElementById("userFoto").src = userFoto;

    function logout() {
      localStorage.clear();
      window.location.href = "login.html";
    }

    async function openAddCatForm() {
      const { value: formData } = await Swal.fire({
        title: "Tambah Kucing Baru",
        html: `
          <div class="text-left">
            <label class="block text-sm font-medium mb-2">Nama Kucing</label>
            <input id="nama" class="swal2-input" placeholder="Contoh: Milo" required>
            
            <label class="block text-sm font-medium mb-2 mt-4">Ras (opsional)</label>
            <input id="ras" class="swal2-input" placeholder="Contoh: Persia, Kampung">
            
            <label class="block text-sm font-medium mb-2 mt-4">Usia</label>
            <input id="usia" class="swal2-input" placeholder="Contoh: 2 tahun 3 bulan">
            
            <label class="block text-sm font-medium mb-2 mt-4">Berat Badan (kg)</label>
            <input id="berat" type="number" step="0.1" class="swal2-input" placeholder="Contoh: 4.2">
            
            <label class="block text-sm font-medium mb-2 mt-4">Foto Kucing</label>
            <input type="file" id="foto" accept="image/*" class="swal2-file">
          </div>
        `,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: "Simpan Kucing",
        preConfirm: () => {
          const nama = document.getElementById("nama").value.trim();
          if (!nama) {
            Swal.showValidationMessage("Nama kucing wajib diisi!");
            return false;
          }
          return {
            nama,
            ras: document.getElementById("ras").value || "Kampung",
            usia: document.getElementById("usia").value || "Tidak diketahui",
            berat: document.getElementById("berat").value || "0",
            foto: document.getElementById("foto").files[0]
          };
        }
      });

      if (formData) {
        const fd = new FormData();
        fd.append("nama", formData.nama);
        fd.append("ras", formData.ras);
        fd.append("usia", formData.usia);
        fd.append("berat_badan", formData.berat);
        if (formData.foto) fd.append("foto", formData.foto);

        try {
          const token = localStorage.getItem("access_token");
          const res = await fetch("/api/cats/", {
            method: "POST",
            headers: { "Authorization": `Bearer ${token}` },
            body: fd
          });

          if (res.ok) {
            Swal.fire({
              icon: "success",
              title: "Yeay!",
              text: `${formData.nama} berhasil ditambahkan ke keluargamu!`,
              timer: 2000
            });
          } else {
            const err = await res.json();
            Swal.fire("Gagal", err.detail || "Terjadi kesalahan", "error");
          }
        } catch (err) {
          Swal.fire("Error", "Koneksi gagal", "error");
        }
      }
    }
  </script>
</body>

</html>
