<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Petricord - Daftar</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <style>
    body { font-family: sans-serif; background: #fff8f0; padding: 40px; text-align: center; }
    .box { max-width: 400px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
    input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ddd; }
    button { background: #e67e22; color: white; font-weight: bold; cursor: pointer; }
    .google { background: white; color: #333; border: 2px solid #e67e22; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Buat Akun Baru</h1>
    <input type="text" id="nama" placeholder="Nama (opsional)" />
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="pass" placeholder="Password" required />
    <button onclick="registerManual()">Daftar dengan Email</button>
    <p>atau</p>
    <button class="google" onclick="googleSignIn()">Daftar dengan Google</button>
    <p>Sudah punya akun? <a href="/login.html">Masuk</a></p>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCTwQ8IlGP_N_-fALBqu5269QlvJ7G8Mrk",
      authDomain: "petricord-f8c54.firebaseapp.com",
      projectId: "petricord-f8c54",
      storageBucket: "petricord-f8c54.firebasestorage.app",
      messagingSenderId: "814472267558",
      appId: "1:814472267558:web:d97ddfd93757a7fe5f63e7"
    };
    firebase.initializeApp(firebaseConfig);
    const provider = new firebase.auth.GoogleAuthProvider();

    async function registerManual() {
      const email = document.getElementById("email").value;
      const pass = document.getElementById("pass").value;
      const nama = document.getElementById("nama").value || email.split("@")[0];

      try {
        await firebase.auth().createUserWithEmailAndPassword(email, pass);
        const user = firebase.auth().currentUser;
        await user.updateProfile({ displayName: nama });
        const token = await user.getIdToken();
        await syncToBackend(token);
      } catch (e) {
        alert(e.message);
      }
    }

    async function googleSignIn() {
      try {
        const result = await firebase.auth().signInWithPopup(provider);
        const token = await result.user.getIdToken();
        await syncToBackend(token);
      } catch (e) {
        alert(e.message);
      }
    }

    async function syncToBackend(token) {
      const resp = await fetch("http://127.0.0.1:8000/api/auth/google-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token })
      });
      const data = await resp.json();
      if (data.success) {
        alert("Selamat datang, " + data.user.nama + "!");
        window.location.href = "/add-kucing.html";
      }
    }
  </script>
</body>
</html>
