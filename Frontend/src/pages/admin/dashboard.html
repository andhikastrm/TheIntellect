<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Petricord - Admin Panel</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>

  <body class="text-white">
    <!-- SIDEBAR removed - simplified admin layout -->

    <!-- MAIN CONTENT -->
    <div class="content">
      <h2 class="page-title">Admin Dashboard</h2>
      <p class="muted">
        Hi,
        <span id="user-name" style="font-weight: 600; color: #7f620b"
          >Admin</span
        >! Ayo kelola data Petricord.
      </p>

      <!-- Statistik -->
      <div class="stats-grid mb-6">
        <div class="card stat-card">
          <img
            src="../../assets/icons/users-group-rounded-svgrepo-com.svg"
            style="width: 35px; height: auto"
          />
          <p class="stat-number" id="totalUsers">0</p>
          <p>Total Pengguna Terdaftar</p>
        </div>
        <div class="card stat-card">
          <img
            src="../../assets/icons/cat-kitty-kitten-feline-svgrepo-com.svg"
            style="width: 35px; height: auto"
          />
          <p class="stat-number" id="totalCats">0</p>
          <p>Total Kucing Terdaftar</p>
        </div>
        <div class="card stat-card">
          <img
            src="../../assets/icons/user-check-svgrepo-com.svg"
            style="width: 35px; height: auto"
          />
          <p class="stat-number" id="activeToday">0</p>
          <p>Pengguna Aktif Hari Ini</p>
        </div>
      </div>

      <!-- Daftar User -->
      <div class="card p-4 mb-8">
        <h3>Daftar Pengguna</h3>
        <div id="usersContainer" class="users-grid">
          <!-- User akan muncul di sini -->
        </div>
      </div>

      <!-- Daftar Semua Kucing -->
      <div class="card p-4">
        <h3>Semua Kucing Terdaftar</h3>
        <div id="allCatsContainer" class="cats-grid">
          <!-- Kucing akan muncul di sini -->
        </div>
      </div>
      <div class="logout-wrapper">
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>

    <script type="module" src="/js/dashboard.js"></script>

    <script>
      const token = localStorage.getItem("access_token");

      function logout() {
        localStorage.clear();
        window.location.href = "index.html";
      }

      async function loadAdminData() {
        try {
          // Load semua user
          const usersRes = await fetch("/api/users/", {
            headers: { Authorization: `Bearer ${token}` },
          });
          const users = await usersRes.json();
          document.getElementById("totalUsers").textContent = users.length;

          const usersContainer = document.getElementById("usersContainer");
          users.forEach((u) => {
            usersContainer.innerHTML += `
            <div class="user-card">
              <img src="${
                u.foto_profil || "https://via.placeholder.com/60"
              }" alt="avatar">
              <div>
                <p class="user-name">${u.nama || "Anon"}</p>
                <p class="user-email">${u.email}</p>
                <div style="margin-top:6px">
                  <span class="role-badge ${
                    u.role === "admin" ? "role-admin" : "role-user"
                  }">
                    ${u.role || "user"}
                  </span>
                </div>
              </div>
            </div>
          `;
          });

          // Load semua kucing
          const catsRes = await fetch("/api/admin/cats", {
            headers: { Authorization: `Bearer ${token}` },
          });
          const allCats = await catsRes.json();
          document.getElementById("totalCats").textContent = allCats.length;

          const catsContainer = document.getElementById("allCatsContainer");
          allCats.forEach((cat) => {
            const foto = cat.foto
              ? cat.foto.startsWith("http")
                ? cat.foto
                : `/static/uploads/${cat.foto}`
              : "https://via.placeholder.com/300x200/666/fff?text=No+Foto";
            catsContainer.innerHTML += `
            <div class="cat-card card">
              <img src="${foto}" alt="cat photo">
              <div class="p-5">
                <h4 style="font-size:1rem; font-weight:700">${cat.nama}</h4>
                <p style="color:#666; font-size:0.9rem">Owner: ${
                  cat.owner_nama || "Unknown"
                }</p>
                <p style="font-size:0.9rem">${cat.ras || "Kampung"} • ${
              cat.usia
            } • ${cat.berat_badan} kg</p>
                <button onclick="deleteCat(${
                  cat.id
                })" class="mt-3 btn-red" style="width:100%; padding:10px; border-radius:8px;">
                  Hapus Kucing
                </button>
              </div>
            </div>
          `;
          });
        } catch (err) {
          Swal.fire(
            "Error",
            "Gagal load data admin. Pastikan kamu login sebagai admin!",
            "error"
          );
        }
      }

      function deleteCat(id) {
        Swal.fire({
          title: "Yakin hapus kucing ini?",
          icon: "warning",
          showCancelButton: true,
          confirmButtonText: "Ya, Hapus!",
          confirmButtonColor: "#ef4444",
        }).then(async (result) => {
          if (result.isConfirmed) {
            await fetch(`/api/cats/${id}`, {
              method: "DELETE",
              headers: { Authorization: `Bearer ${token}` },
            });
            Swal.fire("Terhapus!", "", "success");
            loadAdminData();
          }
        });
      }

      // Cek role saat load
      async function checkAdmin() {
        const res = await fetch("/api/auth/me", {
          headers: { Authorization: `Bearer ${token}` },
        });
        const user = await res.json();
        if (user.role !== "admin") {
          Swal.fire(
            "Akses Ditolak",
            "Hanya admin yang bisa masuk sini!",
            "error"
          );
          setTimeout(
            () => (window.location.href = "owner-dashboard.html"),
            2000
          );
        } else {
          loadAdminData();
        }
      }

      window.onload = checkAdmin;

      // LOGOUT
      const logoutBtn = document.getElementById("btn-logout");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", async () => {
          if (!confirm("Keluar dari akun?")) return;
          try {
            if (API.logout) await API.logout();
          } catch (err) {
            console.error("API.logout failed", err);
          }
          try {
            localStorage.removeItem("authToken");
            sessionStorage.clear();
          } catch (e) {
            /* ignore */
          }
          // Redirect to login page (adjust path if your login page differs)
          window.location.href = "/login.html";
        });
      }
    </script>
  </body>
</html>
