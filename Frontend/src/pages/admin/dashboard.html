<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Petricord - Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      background: linear-gradient(135deg, #1e1b4b, #4c1d95);
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
      color: white;
    }

    .sidebar {
      width: 280px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      box-shadow: 10px 0 30px rgba(0, 0, 0, 0.3);
      position: fixed;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 10;
    }

    .content {
      margin-left: 280px;
      padding: 40px;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-red {
      background: #ef4444;
    }

    .btn-red:hover {
      background: #dc2626;
    }

    .btn-gold {
      background: linear-gradient(45deg, #f59e0b, #d97706);
    }

    .btn-gold:hover {
      background: linear-gradient(45deg, #d97706, #b45309);
    }
  </style>
</head>

<body class="text-white">

  <!-- SIDEBAR -->
  <div class="sidebar p-8 flex flex-col justify-between">
    <div>
      <h1 class="text-5xl font-bold text-yellow-400 mb-12 flex items-center gap-3">
        <i class="bi bi-shield-lock"></i> ADMIN
      </h1>
      <nav class="space-y-4">
        <a href="#" class="flex items-center gap-4 text-yellow-300 bg-white/20 py-3 px-4 rounded-xl font-bold">
          <i class="bi bi-speedometer2 text-xl"></i> Dashboard
        </a>
        <a href="owner-dashboard.html"
          class="flex items-center gap-4 text-gray-300 hover:text-white py-3 px-4 rounded-xl transition">
          <i class="bi bi-house-door text-xl"></i> Mode User
        </a>
        <a href="jurnal-hewan.html"
          class="flex items-center gap-4 text-gray-300 hover:text-white py-3 px-4 rounded-xl transition">
          <i class="bi bi-journal-text text-xl"></i> Jurnal Hewan
        </a>
      </nav>
    </div>
    <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white py-4 rounded-full font-bold">
      <i class="bi bi-box-arrow-left"></i> Keluar
    </button>
  </div>

  <!-- MAIN CONTENT -->
  <div class="content">
    <h2 class="text-5xl font-bold mb-2">Admin Panel</h2>
    <p class="text-gray-300 mb-10">Kelola semua data Petricord</p>

    <!-- Statistik -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-12">
      <div class="card p-6 text-center">
        <i class="bi bi-people text-4xl mb-3"></i>
        <p class="text-4xl font-bold" id="totalUsers">0</p>
        <p>Total Pengguna</p>
      </div>
      <div class="card p-6 text-center">
        <i class="bi bi-heart-fill text-4xl mb-3 text-pink-400"></i>
        <p class="text-4xl font-bold" id="totalCats">0</p>
        <p>Total Kucing</p>
      </div>
      <div class="card p-6 text-center">
        <i class="bi bi-person-check text-4xl mb-3 text-green-400"></i>
        <p class="text-4xl font-bold" id="activeToday">0</p>
        <p>Aktif Hari Ini</p>
      </div>
      <div class="card p-6 text-center">
        <i class="bi bi-trophy text-4xl mb-3 text-yellow-400"></i>
        <p class="text-4xl font-bold">Admin</p>
        <p>Role Kamu</p>
      </div>
    </div>

    <!-- Daftar User -->
    <div class="card p-8 mb-8">
      <h3 class="text-2xl font-bold mb-6">Daftar Pengguna</h3>
      <div id="usersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- User akan muncul di sini -->
      </div>
    </div>

    <!-- Daftar Semua Kucing -->
    <div class="card p-8">
      <h3 class="text-2xl font-bold mb-6">Semua Kucing Terdaftar</h3>
      <div id="allCatsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
        <!-- Kucing akan muncul di sini -->
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("access_token");

    function logout() {
      localStorage.clear();
      window.location.href = "login.html";
    }

    async function loadAdminData() {
      try {
        // Load semua user
        const usersRes = await fetch("/api/users/", { headers: { Authorization: `Bearer ${token}` } });
        const users = await usersRes.json();
        document.getElementById("totalUsers").textContent = users.length;

        const usersContainer = document.getElementById("usersContainer");
        users.forEach(u => {
          usersContainer.innerHTML += `
            <div class="bg-white/10 rounded-xl p-5 flex items-center gap-4">
              <img src="${u.foto_profil || 'https://via.placeholder.com/60'}" class="w-16 h-16 rounded-full object-cover">
              <div>
                <p class="font-bold">${u.nama || "Anon"}</p>
                <p class="text-sm text-gray-300">${u.email}</p>
                <span class="text-xs px-3 py-1 rounded-full ${u.role === 'admin' ? 'bg-yellow-500' : 'bg-blue-500'}">
                  ${u.role || 'user'}
                </span>
              </div>
            </div>
          `;
        });

        // Load semua kucing
        const catsRes = await fetch("/api/admin/cats", { headers: { Authorization: `Bearer ${token}` } });
        const allCats = await catsRes.json();
        document.getElementById("totalCats").textContent = allCats.length;

        const catsContainer = document.getElementById("allCatsContainer");
        allCats.forEach(cat => {
          const foto = cat.foto ? (cat.foto.startsWith("http") ? cat.foto : `/static/uploads/${cat.foto}`) : "https://via.placeholder.com/300x200/666/fff?text=No+Foto";
          catsContainer.innerHTML += `
            <div class="bg-white/10 rounded-2xl overflow-hidden">
              <img src="${foto}" class="w-full h-48 object-cover">
              <div class="p-5">
                <h4 class="text-xl font-bold">${cat.nama}</h4>
                <p class="text-sm text-gray-300">Owner: ${cat.owner_nama || 'Unknown'}</p>
                <p class="text-sm">${cat.ras || 'Kampung'} • ${cat.usia} • ${cat.berat_badan} kg</p>
                <button onclick="deleteCat(${cat.id})" class="mt-3 btn-red w-full py-2 rounded-lg text-sm">
                  Hapus Kucing
                </button>
              </div>
            </div>
          `;
        });

      } catch (err) {
        Swal.fire("Error", "Gagal load data admin. Pastikan kamu login sebagai admin!", "error");
      }
    }

    function deleteCat(id) {
      Swal.fire({
        title: "Yakin hapus kucing ini?",
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: "Ya, Hapus!",
        confirmButtonColor: "#ef4444"
      }).then(async (result) => {
        if (result.isConfirmed) {
          await fetch(`/api/cats/${id}`, {
            method: "DELETE",
            headers: { Authorization: `Bearer ${token}` }
          });
          Swal.fire("Terhapus!", "", "success");
          loadAdminData();
        }
      });
    }

    // Cek role saat load
    async function checkAdmin() {
      const res = await fetch("/api/auth/me", { headers: { Authorization: `Bearer ${token}` } });
      const user = await res.json();
      if (user.role !== "admin") {
        Swal.fire("Akses Ditolak", "Hanya admin yang bisa masuk sini!", "error");
        setTimeout(() => window.location.href = "owner-dashboard.html", 2000);
      } else {
        loadAdminData();
      }
    }

    window.onload = checkAdmin;
  </script>
</body>

</html>
