<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jurnal Hewan</title>
    <title>Perangkat</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <nav id="sidebar">
      <ul>
        <li>
          <span class="logo">
            <img
              src="../../assets/images/petricord-logo.svg"
              style="width: 100px"
            />
          </span>
          <button onclick="toggleSidebar()" id="toggle-btn">
            <img src="../../assets/icons/double-arrow-right-svgrepo-com.svg" />
          </button>
        </li>
        <li>
          <a href="perangkat.html">
            <img src="../../assets/icons/devices-svgrepo-com-outline.svg" />
            <span>Perangkat</span>
          </a>
        </li>
        <li>
          <a href="notifikasi.html">
            <img
              src="../../assets/icons/notification-alert-2-svgrepo-com.svg"
            />
            <span>Notifikasi</span>
          </a>
        </li>
        <li>
          <a href="riwayat.html">
            <img src="../../assets/icons/log.svg" />
            <span>Riwayat</span>
          </a>
        </li>
        <li>
          <a href="jurnal-hewan.html">
            <img src="../../assets/icons/health-svgrepo-com.svg" />
            <span>Jurnal Hewan</span>
          </a>
        </li>
        <li class="active">
          <a href="#">
            <img src="../../assets/icons/user-svgrepo-com.svg" />
            <span>Profil</span>
          </a>
        </li>
      </ul>
    </nav>
    <main>
      <div class="paw-bg">
        <img src="../../assets/images/paw.png" class="paw deco paw-1" alt="" />
        <img src="../../assets/images/paw.png" class="paw deco paw-2" alt="" />
      </div>
      <div class="header-section">
        <h2>Profil</h2>
      </div>
      <!-- Profil User - Full width (placed before Kelola Hewan) -->
      <section class="profil-user section-full">
        <div class="section-inner">
          <div class="section-header">
            <h3>Profil Saya</h3>
            <div class="actions">
              <button id="btn-edit-profile" class="btn-edit-profile">
                Edit Profil
              </button>
              <button id="btn-logout" class="btn-logout">Logout</button>
            </div>
          </div>
          <div class="profile-card" id="profile-card">
            <div class="profile-photo">
              <img
                id="profile-photo-img"
                src="../../assets/images/petricord-logo.svg"
                alt="Foto Profil"
              />
            </div>
            <div class="profile-info">
              <h4 id="profile-name">Nama Pengguna</h4>
              <div id="profile-email" class="profile-email">
                email@domain.com
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Kelola Hewan (CRUD) - Full width -->
      <section class="kelola-hewan section-full">
        <div class="section-inner">
          <div class="section-header">
            <h3>Kelola Hewan</h3>
            <div class="actions">
              <button id="btn-add-cat" class="btn-add-cat">Tambah Hewan</button>
            </div>
          </div>

          <div class="kelola-list">
            <div class="cats-grid" id="cats-container">
              <!-- Add box -->
              <div class="add-cat-box" id="add-cat-box" title="Tambah Hewan">
                <div class="add-icon">
                  +
                  <!-- You can replace with an SVG icon -->
                </div>
                <div class="add-text">Tambah Hewan</div>
              </div>
              <!-- Cards will be inserted here by JS -->
            </div>
          </div>
        </div>
      </section>

      <!-- Rekaman Medis and Aktivitas removed from this page (handled elsewhere) -->

      <!-- Modals / Forms (hidden by default) -->
      <div id="modal-overlay" class="modal-overlay hidden"></div>

      <!-- Add/Edit Cat Modal -->
      <div id="modal-cat" class="modal hidden" role="dialog" aria-modal="true">
        <div class="modal-content">
          <h4 id="modal-cat-title">Tambah Hewan</h4>
          <form id="form-cat">
            <input type="hidden" name="id" />
            <label
              >Foto:
              <input
                name="photo"
                id="cat-photo-input"
                type="file"
                accept="image/*"
              />
            </label>
            <div
              class="photo-preview"
              id="cat-photo-preview"
              style="display: none; margin-bottom: 8px"
            >
              <img
                src=""
                alt="preview"
                style="max-width: 120px; max-height: 120px; border-radius: 8px"
              />
            </div>
            <label>Nama:<input name="name" required /></label>
            <label>Ras:<input name="breed" /></label>
            <label
              >Usia (bulan):<input name="ageMonths" type="number" min="0"
            /></label>
            <label
              >Berat (kg):<input name="weight" type="number" step="0.1" min="0"
            /></label>
            <div class="modal-actions">
              <button type="submit" class="btn-primary">Simpan</button>
              <button type="button" id="btn-cancel-cat" class="btn-cancel-cat">
                Batal
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Profile Edit Modal -->
      <div
        id="modal-profile"
        class="modal hidden"
        role="dialog"
        aria-modal="true"
      >
        <div class="modal-content">
          <h4>Edit Profil</h4>
          <form id="form-profile">
            <label
              >Foto Profil:
              <input
                name="photo"
                id="profile-photo-input"
                type="file"
                accept="image/*"
              />
            </label>
            <div
              class="photo-preview"
              id="profile-photo-preview"
              style="display: none; margin-bottom: 8px"
            >
              <img
                src=""
                alt="preview"
                style="max-width: 120px; max-height: 120px; border-radius: 50%"
              />
            </div>
            <label>Nama:<input name="name" required /></label>
            <div class="modal-actions">
              <button type="submit" class="btn-primary">Simpan</button>
              <button
                type="button"
                id="btn-cancel-profile"
                class="btn-cancel-cat"
              >
                Batal
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
    <script type="module" src="/js/profil.js"></script>
    <script>
      // Toggle sidebar – versi anti-gagal
      document.addEventListener("DOMContentLoaded", () => {
        const toggleButton = document.getElementById("toggle-btn");
        const sidebar = document.getElementById("sidebar");

        if (!toggleButton || !sidebar) {
          console.warn("Tombol atau sidebar nggak ketemu!");
          return;
        }

        toggleButton.addEventListener("click", () => {
          sidebar.classList.toggle("close");
          toggleButton.classList.toggle("rotate");

          // optional: simpan status ke localStorage biar ingat saat refresh
          localStorage.setItem(
            "sidebarClosed",
            sidebar.classList.contains("close")
          );
        });

        // ingat posisi terakhir saat reload
        if (
          localStorage !== "undefined" &&
          localStorage.getItem("sidebarClosed") === "true"
        ) {
          sidebar.classList.add("close");
          toggleButton.classList.add("rotate");
        }
      });
    </script>

    <!-- App logic for profil page: UI + placeholder API handlers -->
    <script>
      /*
            Placeholder API functions for profile & cats. Replace with real fetch calls.
            Profile endpoints examples:
              GET  /api/profile
              PUT  /api/profile
          */
      const API = {
        async fetchCats() {
          return [];
        },
        async createCat(cat) {
          return cat;
        },
        async updateCat(id, cat) {
          return cat;
        },
        async deleteCat(id) {
          return true;
        },

        async fetchProfile() {
          /* TODO: implement API call */ return {
            id: "me",
            name: "Nama Pengguna",
            email: "email@domain.com",
            photoData: null,
          };
        },
        async updateProfile(profile) {
          /* TODO: implement API call */ return profile;
        },
      };

      const state = { cats: [], profile: null };

      function showModal(id) {
        document.getElementById("modal-overlay").classList.remove("hidden");
        document.getElementById(id).classList.remove("hidden");
      }
      function closeModal(id) {
        document.getElementById("modal-overlay").classList.add("hidden");
        document.getElementById(id).classList.add("hidden");
      }

      function readFileAsDataURL(file) {
        return new Promise((res, rej) => {
          const fr = new FileReader();
          fr.onload = () => res(fr.result);
          fr.onerror = rej;
          fr.readAsDataURL(file);
        });
      }

      function renderProfile() {
        const p = state.profile || {
          name: "Nama Pengguna",
          email: "email@domain.com",
          photoData: null,
        };
        const img = document.getElementById("profile-photo-img");
        img.src = p.photoData || "../../assets/images/paw.png";
        img.alt = p.name || "Profil";
        document.getElementById("profile-name").textContent = p.name || "";
        document.getElementById("profile-email").textContent = p.email || "";
      }

      function renderCats() {
        const container = document.getElementById("cats-container");
        const addBoxHtml = `
              <div class="add-cat-box" id="add-cat-box" title="Tambah Hewan">
                <div class="add-icon">+</div>
                <div class="add-text">Tambah Hewan</div>
              </div>`;
        container.innerHTML = addBoxHtml;
        state.cats.forEach((cat) => {
          const card = document.createElement("div");
          card.className = "cat-card";
          card.dataset.id = cat.id;
          const imgSrc = cat.photoData || "../../assets/images/paw.png";
          card.innerHTML = `
                <div class="cat-left"><img src="${imgSrc}" alt="${
            cat.name
          }" /></div>
                <div class="cat-right">
                  <h4 class="cat-name">${cat.name}</h4>
                  <div class="cat-meta">${
                    cat.breed ? "Ras: " + cat.breed : ""
                  }</div>
                  <div class="cat-meta">${
                    cat.ageMonths ? cat.ageMonths + " bulan" : ""
                  } ${cat.weight ? " - " + cat.weight + " kg" : ""}</div>
                  <div class="card-actions">
                    <button class="btn-edit-cat" data-id="${
                      cat.id
                    }">Edit</button>
                    <button class="btn-delete-cat" data-id="${
                      cat.id
                    }">Hapus</button>
                  </div>
                </div>`;
          container.appendChild(card);
        });
      }

      // Wire up UI
      document.addEventListener("DOMContentLoaded", async () => {
        state.cats = await API.fetchCats();
        state.profile = await API.fetchProfile();
        renderProfile();
        renderCats();

        // Profile edit
        document
          .getElementById("btn-edit-profile")
          .addEventListener("click", () => {
            const form = document.getElementById("form-profile");
            form.reset();
            const preview = document.getElementById("profile-photo-preview");
            preview.style.display = "none";
            preview.querySelector("img").src = "";
            if (state.profile) form.name.value = state.profile.name || "";
            showModal("modal-profile");
          });
        document
          .getElementById("btn-cancel-profile")
          .addEventListener("click", () => closeModal("modal-profile"));

        const pInput = document.getElementById("profile-photo-input");
        if (pInput)
          pInput.addEventListener("change", (ev) => {
            const f = ev.target.files && ev.target.files[0];
            const preview = document.getElementById("profile-photo-preview");
            const img = preview.querySelector("img");
            if (f) {
              img.src = URL.createObjectURL(f);
              preview.style.display = "";
            } else {
              img.src = "";
              preview.style.display = "none";
            }
          });

        document
          .getElementById("form-profile")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const form = e.target;
            const fd = new FormData(form);
            const file = form.photo.files && form.photo.files[0];
            let photoData = (state.profile && state.profile.photoData) || null;
            if (file) photoData = await readFileAsDataURL(file);
            const updated = {
              ...(state.profile || {}),
              name: fd.get("name"),
              photoData,
            };
            await API.updateProfile(updated);
            state.profile = updated;
            renderProfile();
            closeModal("modal-profile");
          });

        // Add cat handling (kept)
        const openAddCatModal = () => {
          const form = document.getElementById("form-cat");
          form.reset();
          form.id.value = "";
          const preview = document.getElementById("cat-photo-preview");
          preview.style.display = "none";
          preview.querySelector("img").src = "";
          document.getElementById("modal-cat-title").textContent =
            "Tambah Hewan";
          showModal("modal-cat");
        };
        document
          .getElementById("btn-add-cat")
          .addEventListener("click", openAddCatModal);
        document
          .getElementById("cats-container")
          .addEventListener("click", (e) => {
            const add = e.target.closest("#add-cat-box");
            if (add) openAddCatModal();
          });

        document
          .getElementById("btn-cancel-cat")
          .addEventListener("click", () => closeModal("modal-cat"));

        // Cat photo preview
        const photoInput = document.getElementById("cat-photo-input");
        if (photoInput)
          photoInput.addEventListener("change", (ev) => {
            const f = ev.target.files && ev.target.files[0];
            const preview = document.getElementById("cat-photo-preview");
            const img = preview.querySelector("img");
            if (f) {
              img.src = URL.createObjectURL(f);
              preview.style.display = "";
            } else {
              img.src = "";
              preview.style.display = "none";
            }
          });

        document
          .getElementById("form-cat")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const form = e.target;
            const fd = new FormData(form);
            const id = fd.get("id");
            const file = form.photo.files && form.photo.files[0];
            let photoData = null;
            if (file) photoData = await readFileAsDataURL(file);
            if (id) {
              const cat = state.cats.find((c) => c.id === id);
              if (!cat) return;
              cat.name = fd.get("name");
              cat.breed = fd.get("breed");
              cat.ageMonths = fd.get("ageMonths");
              cat.weight = fd.get("weight");
              if (photoData) cat.photoData = photoData;
              await API.updateCat(cat.id, cat);
            } else {
              const cat = {
                id: genId("cat"),
                name: fd.get("name"),
                breed: fd.get("breed"),
                ageMonths: fd.get("ageMonths"),
                weight: fd.get("weight"),
                photoData,
              };
              const created = await API.createCat(cat);
              state.cats.push(created);
            }
            renderCats();
            closeModal("modal-cat");
          });

        // Edit/Delete cats
        document
          .getElementById("cats-container")
          .addEventListener("click", (e) => {
            const btn = e.target.closest("button");
            if (!btn) return;
            const id = btn.dataset.id;
            if (btn.classList.contains("btn-edit-cat")) {
              const cat = state.cats.find((c) => c.id === id);
              if (!cat) return;
              const form = document.getElementById("form-cat");
              form.id.value = cat.id;
              form.name.value = cat.name || "";
              form.breed.value = cat.breed || "";
              form.ageMonths.value = cat.ageMonths || "";
              form.weight.value = cat.weight || "";
              const preview = document.getElementById("cat-photo-preview");
              const img = preview.querySelector("img");
              if (cat.photoData) {
                img.src = cat.photoData;
                preview.style.display = "";
              } else {
                img.src = "";
                preview.style.display = "none";
              }
              document.getElementById("modal-cat-title").textContent =
                "Edit Hewan";
              showModal("modal-cat");
            }
            if (btn.classList.contains("btn-delete-cat")) {
              if (!confirm("Hapus hewan ini?")) return;
              state.cats = state.cats.filter((c) => c.id !== id);
              API.deleteCat(id);
              renderCats();
            }
          });

        // Logout button: calls API.logout (if available), clears storage and redirects
        const logoutBtn = document.getElementById('btn-logout');
        if (logoutBtn) {
          logoutBtn.addEventListener('click', async () => {
            if (!confirm('Keluar dari akun?')) return;
            try {
              if (API.logout) await API.logout();
            } catch (err) {
              console.error('API.logout failed', err);
            }
            try {
              localStorage.removeItem('authToken');
              sessionStorage.clear();
            } catch (e) { /* ignore */ }
            // Redirect to login page (adjust path if your login page differs)
            window.location.href = '/login.html';
          });
        }
      });
    </script>
  </body>
</html>
