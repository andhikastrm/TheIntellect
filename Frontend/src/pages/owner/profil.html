<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

<body>

    <ul>

        </span>
        <button onclick="toggleSidebar()" id="toggle-btn">
          <img src="../../assets/icons/double-arrow-right-svgrepo-com.svg" />
        </button>
      </li>
      <li>
        <a href="perangkat.html">
          <img src="../../assets/icons/devices-svgrepo-com-outline.svg" />
          <span>Perangkat</span>
        </a>
      </li>
      <li>
        <a href="notifikasi.html">
          <img src="../../assets/icons/notification-alert-2-svgrepo-com.svg" />
          <span>Notifikasi</span>
        </a>
      </li>
      <li>
        <a href="riwayat.html">
          <img src="../../assets/icons/log.svg" />
          <span>Riwayat</span>
        </a>
      </li>
      <li>
        <a href="jurnal-hewan.html">
          <img src="../../assets/icons/health-svgrepo-com.svg" />
          <span>Jurnal Hewan</span>
        </a>
      </li>
      <li class="active">
        <a href="#">
          <img src="../../assets/icons/user-svgrepo-com.svg" />
          <span>Profil</span>
        </a>
      </li>
    </ul>
  </nav>
  <main>
    <div class="paw-bg">
      <img src="../../assets/images/paw.png" class="paw deco paw-1" alt="" />
      <img src="../../assets/images/paw.png" class="paw deco paw-2" alt="" />
    </div>
    <div class="header-section">
      <h2>Profil</h2>
    </div>

    <!-- Profil User - Full width -->
    <section class="profil-user section-full">
      <div class="section-inner">
        <div class="section-header">
          <h3>Profil Saya</h3>
          <div class="actions">
            <button id="btn-edit-profile" class="btn-edit-profile">Edit Profil</button>
            <button id="btn-logout" class="btn-logout">Logout</button>
          </div>
        </div>
        <div class="profile-card" id="profile-card">
          <div class="profile-photo">
            <img id="profile-photo-img" src="../../assets/images/petricord-logo.svg" alt="Foto Profil" />
          </div>
          <div class="profile-info">
            <h4 id="profile-name">Nama Pengguna</h4>
            <div id="profile-email" class="profile-email">email@domain.com</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Kelola Hewan (CRUD) - Full width -->
    <section class="kelola-hewan section-full">
      <div class="section-inner">
        <div class="section-header">
          <h3>Kelola Hewan</h3>
        </div>
        <div class="kelola-list">
          <div class="cats-grid" id="cats-container">
            <!-- Add box -->
            <div class="add-cat-box" id="add-cat-box" title="Tambah Hewan">
              <div class="add-icon">+</div>
              <div class="add-text">Tambah Hewan</div>
            </div>
            <!-- Cards will be inserted here by JS -->
          </div>
        </div>
      </div>
    </section>

    <!-- Modals -->
    <div id="modal-overlay" class="modal-overlay hidden"></div>

    <!-- Add/Edit Cat Modal -->
    <div id="modal-cat" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <h4 id="modal-cat-title">Tambah Hewan</h4>
        <form id="form-cat">
          <input type="hidden" name="id" />
          <label>Foto:
            <input name="photo" id="cat-photo-input" type="file" accept="image/*" />
          </label>
          <div class="photo-preview" id="cat-photo-preview" style="display: none; margin-bottom: 8px">
            <img src="" alt="preview" style="max-width: 120px; max-height: 120px; border-radius: 8px" />
          </div>
          <label>Nama:<input name="name" required /></label>
          <label>Ras:<input name="breed" /></label>
          <label>Usia (bulan):<input name="ageMonths" type="number" min="0" /></label>
          <label>Berat (kg):<input name="weight" type="number" step="0.1" min="0" /></label>
          <label>Deskripsi:<textarea name="description" rows="3"></textarea></label>
          <div class="modal-actions">
            <button type="submit" class="btn-primary">Simpan</button>
            <button type="button" id="btn-cancel-cat" class="btn-cancel-cat">Batal</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Profile Edit Modal -->
    <div id="modal-profile" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <h4>Edit Profil</h4>
        <form id="form-profile">
          <label>Foto Profil:
            <input name="photo" id="profile-photo-input" type="file" accept="image/*" />
          </label>
          <div class="photo-preview" id="profile-photo-preview" style="display: none; margin-bottom: 8px">
            <img src="" alt="preview" style="max-width: 120px; max-height: 120px; border-radius: 50%" />
          </div>
          <label>Nama:<input name="name" required /></label>
          <div class="modal-actions">
            <button type="submit" class="btn-primary">Simpan</button>
            <button type="button" id="btn-cancel-profile" class="btn-cancel-cat">Batal</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script type="module" src="/js/profil.js"></script>

  <script>
    
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCTwQ8IlGP_N_-fALBqu5269QlvJ7G8Mrk",
      authDomain: "petricord-f8c54.firebaseapp.com",
      projectId: "petricord-f8c54",
      storageBucket: "petricord-f8c54.firebasestorage.app",
      messagingSenderId: "814472267558",
      appId: "1:814472267558:web:d97ddfd93757a7fe5f63e7"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Firebase Auth State - Auto-fill profile from Google login
    auth.onAuthStateChanged((user) => {
      if (user) {
        document.getElementById("profile-name").textContent = user.displayName || user.email.split("@")[0];
        document.getElementById("profile-email").textContent = user.email;
        if (user.photoURL) {
          document.getElementById("profile-photo-img").src = user.photoURL;
        }
        console.log("Firebase user:", user.displayName);
      }
    });
  </script>

  <script>
    // Sidebar Toggle
    document.addEventListener("DOMContentLoaded", () => {
      const toggleButton = document.getElementById("toggle-btn");
      const sidebar = document.getElementById("sidebar");

      if (!toggleButton || !sidebar) return;

      toggleButton.addEventListener("click", () => {
        sidebar.classList.toggle("close");
        toggleButton.classList.toggle("rotate");
        localStorage.setItem("sidebarClosed", sidebar.classList.contains("close"));
      });

      if (localStorage.getItem("sidebarClosed") === "true") {
        sidebar.classList.add("close");
        toggleButton.classList.add("rotate");
      }
    });
  </script>

  <!-- Main API Integration Script -->
  <script>
    const API = {
      baseUrl: "http://localhost:8000",

      getToken() {
        return localStorage.getItem("access_token");
      },

      getAuthHeaders() {
        const token = this.getToken();
        return token ? { Authorization: `Bearer ${token}` } : {};
      },

      // ==================== CATS CRUD ====================

      async fetchCats() {
        try {
          const res = await fetch(`${this.baseUrl}/api/cats/`, {
            headers: this.getAuthHeaders()
          });

          if (!res.ok) {
            if (res.status === 401) {
              alert("Session expired. Please login again.");
              window.location.href = "/pages/auth/login.html";
              return [];
            }
            throw new Error(`HTTP ${res.status}`);
          }

          const data = await res.json();
          console.log("Fetched cats:", data);

          return (data.kucings || []).map(k => ({
            id: k.id,
            name: k.nama,
            breed: k.ras,
            ageMonths: k.umur,
            weight: k.berat_badan,
            photoData: k.foto,
            description: k.deskripsi
          }));
        } catch (err) {
          console.error('fetchCats failed:', err);
          return [];
        }
      },

      async createCat(catData, file) {
        try {
          const fd = new FormData();
          fd.append('nama', catData.name || '');
          fd.append('umur', catData.ageMonths || '');
          fd.append('ras', catData.breed || '');
          fd.append('berat_badan', catData.weight || '');
          fd.append('deskripsi', catData.description || '');
          if (file) fd.append('foto', file);

          const res = await fetch(`${this.baseUrl}/api/cats/`, {
            method: 'POST',
            headers: this.getAuthHeaders(),
            body: fd
          });

          if (!res.ok) {
            const errorText = await res.text();
            throw new Error(errorText || 'Failed to create cat');
          }

          const data = await res.json();
          console.log("Created cat:", data);

          if (data.kucing) {
            const k = data.kucing;
            return {
              id: k.id,
              name: k.nama,
              breed: k.ras,
              ageMonths: k.umur,
              weight: k.berat_badan,
              photoData: k.foto,
              description: k.deskripsi
            };
          }
          return null;
        } catch (err) {
          console.error('createCat failed:', err);
          alert('Gagal menambah hewan: ' + err.message);
          return null;
        }
      },

      async updateCat(id, catData, file) {
        try {
          const fd = new FormData();
          fd.append('nama', catData.name || '');
          fd.append('umur', catData.ageMonths || '');
          fd.append('ras', catData.breed || '');
          fd.append('berat_badan', catData.weight || '');
          fd.append('deskripsi', catData.description || '');
          if (file) fd.append('foto', file);

          const res = await fetch(`${this.baseUrl}/api/cats/${id}`, {
            method: 'PUT',
            headers: this.getAuthHeaders(),
            body: fd
          });

          if (!res.ok) {
            const errorText = await res.text();
            throw new Error(errorText || 'Failed to update cat');
          }

          const data = await res.json();
          console.log("Updated cat:", data);

          if (data.kucing) {
            const k = data.kucing;
            return {
              id: k.id,
              name: k.nama,
              breed: k.ras,
              ageMonths: k.umur,
              weight: k.berat_badan,
              photoData: k.foto,
              description: k.deskripsi
            };
          }
          return null;
        } catch (err) {
          console.error('updateCat failed:', err);
          alert('Gagal update hewan: ' + err.message);
          return null;
        }
      },

      async deleteCat(id) {
        try {
          const res = await fetch(`${this.baseUrl}/api/cats/${id}`, {
            method: 'DELETE',
            headers: this.getAuthHeaders()
          });

          if (!res.ok) {
            throw new Error('Failed to delete cat');
          }

          const data = await res.json();
          console.log("Deleted cat:", data);
          return true;
        } catch (err) {
          console.error('deleteCat failed:', err);
          alert('Gagal hapus hewan: ' + err.message);
          return false;
        }
      }
    };

    // ==================== STATE & UI ====================

    const state = { cats: [], profile: null };

    function showModal(id) {
      document.getElementById("modal-overlay").classList.remove("hidden");
      document.getElementById(id).classList.remove("hidden");
    }

    function closeModal(id) {
      document.getElementById("modal-overlay").classList.add("hidden");
      document.getElementById(id).classList.add("hidden");
    }

    function renderProfile() {
      const p = state.profile || {
        name: "Nama Pengguna",
        email: "email@domain.com",
        photoData: null,
      };
      const img = document.getElementById("profile-photo-img");
      img.src = p.photoData || "../../assets/images/paw.png";
      img.alt = p.name || "Profil";
      document.getElementById("profile-name").textContent = p.name || "";
      document.getElementById("profile-email").textContent = p.email || "";
    }

    function renderCats() {
      const container = document.getElementById("cats-container");
      const addBoxHtml = `
        <div class="add-cat-box" id="add-cat-box" title="Tambah Hewan">
          <div class="add-icon">+</div>
          <div class="add-text">Tambah Hewan</div>
        </div>`;
      container.innerHTML = addBoxHtml;

      state.cats.forEach((cat) => {
        const card = document.createElement("div");
        card.className = "cat-card";
        card.dataset.id = cat.id;

        // Handle photo URL - prepend base URL if needed
        let imgSrc = cat.photoData || "../../assets/images/paw.png";
        if (imgSrc && imgSrc.startsWith('/static/')) {
          imgSrc = API.baseUrl + imgSrc;
        }

        card.innerHTML = `
          <div class="cat-left"><img src="${imgSrc}" alt="${cat.name}" /></div>
          <div class="cat-right">
            <h4 class="cat-name">${cat.name}</h4>
            <div class="cat-meta">${cat.breed ? "Ras: " + cat.breed : ""}</div>
            <div class="cat-meta">${cat.ageMonths ? cat.ageMonths + " bulan" : ""} ${cat.weight ? " - " + cat.weight + " kg" : ""}</div>
            <div class="card-actions">
              <button class="btn-edit-cat" data-id="${cat.id}">Edit</button>
              <button class="btn-delete-cat" data-id="${cat.id}">Hapus</button>
            </div>
          </div>`;
        container.appendChild(card);
      });
    }

    // ==================== EVENT HANDLERS ====================

    document.addEventListener("DOMContentLoaded", async () => {
      // Load cats from backend
      state.cats = await API.fetchCats();
      renderCats();

      // Add cat button
      document.getElementById("cats-container").addEventListener("click", (e) => {
        const add = e.target.closest("#add-cat-box");
        if (add) {
          const form = document.getElementById("form-cat");
          form.reset();
          form.id.value = "";
          document.getElementById("cat-photo-preview").style.display = "none";
          document.getElementById("modal-cat-title").textContent = "Tambah Hewan";
          showModal("modal-cat");
        }
      });

      // Cancel cat modal
      document.getElementById("btn-cancel-cat").addEventListener("click", () => {
        closeModal("modal-cat");
      });

      // Cat photo preview
      document.getElementById("cat-photo-input").addEventListener("change", (ev) => {
        const file = ev.target.files?.[0];
        const preview = document.getElementById("cat-photo-preview");
        const img = preview.querySelector("img");
        if (file) {
          img.src = URL.createObjectURL(file);
          preview.style.display = "";
        } else {
          img.src = "";
          preview.style.display = "none";
        }
      });

      // Submit cat form (Create or Update)
      document.getElementById("form-cat").addEventListener("submit", async (e) => {
        e.preventDefault();
        const form = e.target;
        const id = form.id.value;
        const file = form.photo.files?.[0];

        const catData = {
          name: form.name.value,
          breed: form.breed.value,
          ageMonths: form.ageMonths.value,
          weight: form.weight.value,
          description: form.description.value
        };

        if (id) {
          // UPDATE
          const updated = await API.updateCat(id, catData, file);
          if (updated) {
            const idx = state.cats.findIndex(c => c.id == id);
            if (idx !== -1) state.cats[idx] = updated;
          }
        } else {
          // CREATE
          const created = await API.createCat(catData, file);
          if (created) {
            state.cats.push(created);
          }
        }

        renderCats();
        closeModal("modal-cat");
      });

      // Edit/Delete cats
      document.getElementById("cats-container").addEventListener("click", async (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;

        const id = btn.dataset.id;

        // EDIT
        if (btn.classList.contains("btn-edit-cat")) {
          const cat = state.cats.find((c) => c.id == id);
          if (!cat) return;

          const form = document.getElementById("form-cat");
          form.id.value = cat.id;
          form.name.value = cat.name || "";
          form.breed.value = cat.breed || "";
          form.ageMonths.value = cat.ageMonths || "";
          form.weight.value = cat.weight || "";
          form.description.value = cat.description || "";

          const preview = document.getElementById("cat-photo-preview");
          const img = preview.querySelector("img");
          if (cat.photoData) {
            let photoUrl = cat.photoData;
            if (photoUrl.startsWith('/static/')) {
              photoUrl = API.baseUrl + photoUrl;
            }
            img.src = photoUrl;
            preview.style.display = "";
          } else {
            img.src = "";
            preview.style.display = "none";
          }

          document.getElementById("modal-cat-title").textContent = "Edit Hewan";
          showModal("modal-cat");
        }

        // DELETE
        if (btn.classList.contains("btn-delete-cat")) {
          if (!confirm("Hapus hewan ini?")) return;

          const success = await API.deleteCat(id);
          if (success) {
            state.cats = state.cats.filter((c) => c.id != id);
            renderCats();
          }
        }
      });

      // Logout button
      document.getElementById('btn-logout').addEventListener('click', async () => {
        if (!confirm('Keluar dari akun?')) return;

        try {
          await firebase.auth().signOut();
        } catch (e) {
          console.error('Firebase signout error:', e);
        }

        localStorage.removeItem('access_token');
        sessionStorage.clear();
        window.location.href = '/pages/auth/login.html';
      });
    });
  </script>
</body>

</html>
