    <!-- Rekaman Medis and Aktivitas removed from this page (handled elsewhere) -->

    <!-- Add/Edit Cat Modal -->
    <div id="modal-cat" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <h4 id="modal-cat-title">Tambah Hewan</h4>
        <form id="form-cat">
          <input type="hidden" name="id" />
          <label>Foto:
            <input name="photo" id="cat-photo-input" type="file" accept="image/*" />
          </label>
          <div class="photo-preview" id="cat-photo-preview" style="display: none; margin-bottom: 8px">
            <img src="" alt="preview" style="max-width: 120px; max-height: 120px; border-radius: 8px" />
          </div>
          <label>Nama:<input name="name" required /></label>
          <label>Ras:<input name="breed" /></label>
          <label>Usia (bulan):<input name="ageMonths" type="number" min="0" /></label>
          <label>Berat (kg):<input name="weight" type="number" step="0.1" min="0" /></label>
          <div class="modal-actions">
            <button type="submit" class="btn-primary">Simpan</button>
            <button type="button" id="btn-cancel-cat" class="btn-cancel-cat">
              Batal
            </button>
          </div>
        </form>
      </div>

    <!-- Profile Edit Modal -->
    <div id="modal-profile" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <h4>Edit Profil</h4>
        <form id="form-profile">
          <label>Foto Profil:
            <input name="photo" id="profile-photo-input" type="file" accept="image/*" />
          </label>
          <div class="photo-preview" id="profile-photo-preview" style="display: none; margin-bottom: 8px">
            <img src="" alt="preview" style="max-width: 120px; max-height: 120px; border-radius: 50%" />
          </div>
          <label>Nama:<input name="name" required /></label>
          <div class="modal-actions">
            <button type="submit" class="btn-primary">Simpan</button>
            <button type="button" id="btn-cancel-profile" class="btn-cancel-cat">
              Batal
            </button>
          </div>
        </form>
      </div>
    </div>

  <script>
    // Toggle sidebar – versi anti-gagal
    document.addEventListener("DOMContentLoaded", () => {
      const toggleButton = document.getElementById("toggle-btn");
      const sidebar = document.getElementById("sidebar");

      if (!toggleButton || !sidebar) {
        console.warn("Tombol atau sidebar nggak ketemu!");
        return;
      }

      toggleButton.addEventListener("click", () => {
        sidebar.classList.toggle("close");
        toggleButton.classList.toggle("rotate");

        // optional: simpan status ke localStorage biar ingat saat refresh
        localStorage.setItem(
          "sidebarClosed",
          sidebar.classList.contains("close")
        );
      });

      // ingat posisi terakhir saat reload
      if (
        localStorage !== "undefined" &&
        localStorage.getItem("sidebarClosed") === "true"
      ) {
        sidebar.classList.add("close");
        toggleButton.classList.add("rotate");
      }
    });
  </script>

  <!-- App logic for profil page: UI + placeholder API handlers -->
  <script>
    /*
          Placeholder API functions for profile & cats. Replace with real fetch calls.
          Profile endpoints examples:
            GET  /api/profile
            PUT  /api/profile
        */
    const STORAGE_KEYS = {
      CATS: 'petricord_cats_v1',
      PROFILE: 'petricord_profile_v1'
    };

    const API = {
      baseUrl: "http://localhost:8000",
      async fetchCats() {
        const token = localStorage.getItem("access_token");
        if (token) {
          try {
            const res = await fetch(`${this.baseUrl}/api/cats/`, {
              headers: { Authorization: `Bearer ${token}` }
            });
            if (res.ok) {
              const data = await res.json();
              if (data.kucings) return data.kucings.map(k => ({ id: k.id, name: k.nama, breed: k.ras, ageMonths: k.umur, weight: k.berat_badan, photoData: k.foto, gender: k.jenis_kelamin }));
            }
          } catch (err) {
            console.error('fetchCats backend failed', err);
          }
        }
        try {
          const raw = localStorage.getItem(STORAGE_KEYS.CATS);
          return raw ? JSON.parse(raw) : [];
        } catch (e) {
          console.error('fetchCats parse error', e);
          return [];
        }
      },
      async createCat(cat, file) {
        const token = localStorage.getItem("access_token");
        if (token) {
          try {
            const fd = new FormData();
            fd.append('nama', cat.name || '');
            fd.append('umur', cat.ageMonths || '');
            fd.append('ras', cat.breed || '');
            fd.append('berat_badan', cat.weight || '');
            fd.append('deskripsi', cat.description || '');
            if (file) fd.append('foto', file);
            const res = await fetch(`${this.baseUrl}/api/cats/`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}` },
              body: fd
            });
            if (!res.ok) {
              const txt = await res.text();
              throw new Error(txt || 'Failed to create cat');
            }
            const data = await res.json();
            if (data.kucing) {
              const k = data.kucing;
              return { id: k.id, name: k.nama, breed: k.ras, ageMonths: k.umur, weight: k.berat_badan, photoData: k.foto };
            }
          } catch (err) {
            console.error('createCat backend failed', err);
          }
        }
        const list = await this.fetchCats();
        const created = { ...cat, id: genId('cat') };
        list.push(created);
        localStorage.setItem(STORAGE_KEYS.CATS, JSON.stringify(list));
        return created;
      },
      async updateCat(id, cat) {
        const list = await this.fetchCats();
        const idx = list.findIndex((c) => c.id === id);
        if (idx !== -1) list[idx] = cat;
        localStorage.setItem(STORAGE_KEYS.CATS, JSON.stringify(list));
        return cat;
      },
      async deleteCat(id) {
        const token = localStorage.getItem('access_token');
        if (token) {
          try {
            const res = await fetch(`${this.baseUrl}/api/cats/${id}`, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } });
            if (res.ok) return true;
          } catch (err) { console.error('deleteCat backend failed', err); }
        }
        const list = await this.fetchCats();
        const next = list.filter((c) => c.id !== id);
        localStorage.setItem(STORAGE_KEYS.CATS, JSON.stringify(next));
        return true;
      },

      async fetchProfile() {
        try {
          const raw = localStorage.getItem(STORAGE_KEYS.PROFILE);
          if (raw) return JSON.parse(raw);
        } catch (e) {
          console.error('fetchProfile parse error', e);
        }
        return {
          id: 'me',
          name: 'Nama Pengguna',
          email: 'email@domain.com',
          photoData: null,
        };
      },
      async updateProfile(profile) {
        try {
          localStorage.setItem(STORAGE_KEYS.PROFILE, JSON.stringify(profile));
        } catch (e) {
          console.error('updateProfile error', e);
        }
        return profile;
      },
    };

    // helper to generate unique ids for local objects
    function genId(prefix = 'id') {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
    }

    const state = { cats: [], profile: null };

    function showModal(id) {
      document.getElementById("modal-overlay").classList.remove("hidden");
      document.getElementById(id).classList.remove("hidden");
    }
    function closeModal(id) {
      document.getElementById("modal-overlay").classList.add("hidden");
      document.getElementById(id).classList.add("hidden");
    }

    function readFileAsDataURL(file) {
      return new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload = () => res(fr.result);
        fr.onerror = rej;
        fr.readAsDataURL(file);
      });
    }

    function renderProfile() {
      const p = state.profile || {
        name: "Nama Pengguna",
        email: "email@domain.com",
        photoData: null,
      };
      const img = document.getElementById("profile-photo-img");
      img.src = p.photoData || "../../assets/images/paw.png";
      img.alt = p.name || "Profil";
      document.getElementById("profile-name").textContent = p.name || "";
      document.getElementById("profile-email").textContent = p.email || "";
    }

    function renderCats() {
      const container = document.getElementById("cats-container");
      const addBoxHtml = `
              <div class="add-cat-box" id="add-cat-box" title="Tambah Hewan">
                <div class="add-icon">+</div>
                <div class="add-text">Tambah Hewan</div>
              </div>`;
      container.innerHTML = addBoxHtml;
      state.cats.forEach((cat) => {
        const card = document.createElement("div");
        card.className = "cat-card";
        card.dataset.id = cat.id;
        const imgSrc = cat.photoData || "../../assets/images/paw.png";
        card.innerHTML = `
                <div class="cat-left"><img src="${imgSrc}" alt="${cat.name
          }" /></div>
                <div class="cat-right">
                  <h4 class="cat-name">${cat.name}</h4>
                  <div class="cat-meta">${cat.breed ? "Ras: " + cat.breed : ""
          }</div>
                  <div class="cat-meta">${cat.ageMonths ? cat.ageMonths + " bulan" : ""
          } ${cat.weight ? " - " + cat.weight + " kg" : ""}</div>
                  <div class="card-actions">
                    <button class="btn-edit-cat" data-id="${cat.id
          }">Edit</button>
                    <button class="btn-delete-cat" data-id="${cat.id
          }">Hapus</button>
                  </div>
                </div>`;
        container.appendChild(card);
      });
    }

    // Wire up UI
    document.addEventListener("DOMContentLoaded", async () => {
      state.cats = await API.fetchCats();
      state.profile = await API.fetchProfile();
      renderProfile();
      renderCats();

      // Profile edit
      document
        .getElementById("btn-edit-profile")
        .addEventListener("click", () => {
          const form = document.getElementById("form-profile");
          form.reset();
          const preview = document.getElementById("profile-photo-preview");
          preview.style.display = "none";
          preview.querySelector("img").src = "";
          if (state.profile) form.name.value = state.profile.name || "";
          showModal("modal-profile");
        });
      document
        .getElementById("btn-cancel-profile")
        .addEventListener("click", () => closeModal("modal-profile"));

      const pInput = document.getElementById("profile-photo-input");
      if (pInput)
        pInput.addEventListener("change", (ev) => {
          const f = ev.target.files && ev.target.files[0];
          const preview = document.getElementById("profile-photo-preview");
          const img = preview.querySelector("img");
          if (f) {
            img.src = URL.createObjectURL(f);
            preview.style.display = "";
          } else {
            img.src = "";
            preview.style.display = "none";
          }
        });

      document
        .getElementById("form-profile")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const form = e.target;
          const fd = new FormData(form);
          const file = form.photo.files && form.photo.files[0];
          let photoData = (state.profile && state.profile.photoData) || null;
          if (file) photoData = await readFileAsDataURL(file);
          const updated = {
            ...(state.profile || {}),
            name: fd.get("name"),
            photoData,
          };
          await API.updateProfile(updated);
          state.profile = updated;
          renderProfile();
          closeModal("modal-profile");
        });

      // Add cat handling (kept)
      const openAddCatModal = () => {
        const form = document.getElementById("form-cat");
        form.reset();
        form.id.value = "";
        const preview = document.getElementById("cat-photo-preview");
        preview.style.display = "none";
        preview.querySelector("img").src = "";
        document.getElementById("modal-cat-title").textContent =
          "Tambah Hewan";
        showModal("modal-cat");
      };

      document
        .getElementById("cats-container")
        .addEventListener("click", (e) => {
          const add = e.target.closest("#add-cat-box");
          if (add) openAddCatModal();
        });

      document
        .getElementById("btn-cancel-cat")
        .addEventListener("click", () => closeModal("modal-cat"));

      // Cat photo preview
      const photoInput = document.getElementById("cat-photo-input");
      if (photoInput)
        photoInput.addEventListener("change", (ev) => {
          const f = ev.target.files && ev.target.files[0];
          const preview = document.getElementById("cat-photo-preview");
          const img = preview.querySelector("img");
          if (f) {
            img.src = URL.createObjectURL(f);
            preview.style.display = "";
          } else {
            img.src = "";
            preview.style.display = "none";
          }
        });

      document
        .getElementById("form-cat")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const form = e.target;
          const fd = new FormData(form);
          const id = fd.get("id");
          const file = form.photo.files && form.photo.files[0];
          let photoData = null;
          if (file) photoData = await readFileAsDataURL(file);
          if (id) {
            const cat = state.cats.find((c) => c.id === id);
            if (!cat) return;
            cat.name = fd.get("name");
            cat.breed = fd.get("breed");
            cat.ageMonths = fd.get("ageMonths");
            cat.weight = fd.get("weight");
            if (photoData) cat.photoData = photoData;
            await API.updateCat(cat.id, cat);
          } else {
            const cat = {
              id: genId("cat"),
              name: fd.get("name"),
              breed: fd.get("breed"),
              ageMonths: fd.get("ageMonths"),
              weight: fd.get("weight"),
              photoData,
            };
            const created = await API.createCat(cat, file);
            state.cats.push(created);
          }
          renderCats();
          closeModal("modal-cat");
        });

      // Edit/Delete cats
      document
        .getElementById("cats-container")
        .addEventListener("click", (e) => {
          const btn = e.target.closest("button");
          if (!btn) return;
          const id = btn.dataset.id;
          if (btn.classList.contains("btn-edit-cat")) {
            const cat = state.cats.find((c) => c.id === id);
            if (!cat) return;
            const form = document.getElementById("form-cat");
            form.id.value = cat.id;
            form.name.value = cat.name || "";
            form.breed.value = cat.breed || "";
            form.ageMonths.value = cat.ageMonths || "";
            form.weight.value = cat.weight || "";
            const preview = document.getElementById("cat-photo-preview");
            const img = preview.querySelector("img");
            if (cat.photoData) {
              img.src = cat.photoData;
              preview.style.display = "";
            } else {
              img.src = "";
              preview.style.display = "none";
            }
            document.getElementById("modal-cat-title").textContent =
              "Edit Hewan";
            showModal("modal-cat");
          }
          if (btn.classList.contains("btn-delete-cat")) {
            if (!confirm("Hapus hewan ini?")) return;
            (async () => {
              const ok = await API.deleteCat(id);
              if (ok) {
                state.cats = state.cats.filter((c) => c.id !== id);
                renderCats();
              } else {
                alert('Gagal menghapus hewan.');
              }
            })();
          }
        });

      // Logout button: calls API.logout (if available), clears storage and redirects
      const logoutBtn = document.getElementById('btn-logout');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', async () => {
          if (!confirm('Keluar dari akun?')) return;
          try {
            if (API.logout) await API.logout();
          } catch (err) {
            console.error('API.logout failed', err);
          }
          try {
            localStorage.removeItem('authToken');
            sessionStorage.clear();
          } catch (e) { /* ignore */ }
          // Redirect to login page (adjust path if your login page differs)
          window.location.href = '/login.html';
        });
      }
    });
  </script>
