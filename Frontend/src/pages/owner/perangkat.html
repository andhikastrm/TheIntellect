<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perangkat</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <nav id="sidebar">
      <ul>
        <li>
          <span class="logo">
            <img
              src="../../assets/images/petricord-logo.svg"
              style="width: 100px"
            />
          </span>
          <button onclick="toggleSidebar()" id="toggle-btn">
            <img src="../../assets/icons/double-arrow-right-svgrepo-com.svg" />
          </button>
        </li>
        <li class="active">
          <a href="perangkat.html">
            <img src="../../assets/icons/devices-svgrepo-com-outline.svg" />
            <span>Perangkat</span>
          </a>
        </li>
        <li>
          <a href="notifikasi.html">
            <img
              src="../../assets/icons/notification-alert-2-svgrepo-com.svg"
            />
            <span>Notifikasi</span>
          </a>
        </li>
        <li>
          <a href="riwayat.html">
            <img src="../../assets/icons/log.svg" />
            <span>Riwayat</span>
          </a>
        </li>
        <li>
          <a href="#">
            <img src="../../assets/icons/health-svgrepo-com.svg" />
            <span>Jurnal Hewan</span>
          </a>
        </li>
        <li>
          <a href="profil.html">
            <img src="../../assets/icons/user-svgrepo-com.svg" />
            <span>Profil</span>
          </a>
        </li>
      </ul>
    </nav>

    <main>
      <div class="paw-bg">
        <img src="../../assets/images/paw.png" class="paw deco paw-1" alt="" />
        <img src="../../assets/images/paw.png" class="paw deco paw-2" alt="" />
      </div>

      <div class="header-section">
        <h2>Perangkatmu</h2>
        <div class="header-controls">
          <a class="btn-tambah" href="monitoring.html">+ Tambah</a>
          <div class="search-box">
              <input id="device-search" type="text" placeholder="Cari" />
          </div>
        </div>
      </div>

      <p class="text-secondary">
        Hi,
        <span id="user-name" class="fw-bold" style="color:#7f620b">Cordian</span>!
        Siap memantau kesayanganmu?
      </p>

      <div class="stats-container">
        <div class="stat-card">
          <div class="stat-content">
            <h3 class="text-muted">Total Perangkat</h3>
            <div class="stat-number" id="total-devices">0</div>
          </div>
          <div class="stat-icon">
            <img src="../../assets/icons/devices-svgrepo-com-outline.svg" alt="" />
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-content">
            <h3 class="text-muted">Perangkat Aktif</h3>
            <div class="stat-number" id="total-active-devices">
              0
            </div>
          </div>
          <div class="stat-icon">
            <img src="../../assets/icons/activity-svgrepo-com.svg" alt="" />
          </div>
        </div>
      </div>

      <div class="devices-grid" id="devices-grid">
        <!-- Card akan muncul otomatis di sini -->
      </div>

      <!-- modal placeholder moved below main to avoid clipping -->
    </main>
    <!-- POPUP EDIT NAMA PERANGKAT (moved here so it is not clipped by main or cards) -->
    <div id="editDeviceModal" class="edit-modal" role="dialog" aria-labelledby="editDeviceModalLabel" aria-hidden="true">
      <div class="edit-modal-dialog">
        <div class="edit-modal-content">
          <div class="edit-modal-header">
            <h5 class="edit-modal-title text-primary" id="editDeviceModalLabel">Ganti Nama Perangkat</h5>
            <button type="button" class="edit-modal-close" aria-label="Close" onclick="closeEditModal()">×</button>
          </div>
          <div class="edit-modal-body">
            <input type="text" id="editDeviceNameInput" class="form-control" placeholder="Masukkan nama baru..." />
          </div>
          <div class="edit-modal-footer">
            <button type="button" class="btn-cancel" onclick="closeEditModal()">Batal</button>
            <button type="button" id="saveDeviceNameBtn" class="btn-save">Simpan</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/js/perangkat.js"></script>
    <script>
      // Toggle sidebar – versi anti-gagal
      document.addEventListener("DOMContentLoaded", () => {
        const toggleButton = document.getElementById("toggle-btn");
        const sidebar = document.getElementById("sidebar");

        if (!toggleButton || !sidebar) {
          console.warn("Tombol atau sidebar nggak ketemu!");
          return;
        }

        toggleButton.addEventListener("click", () => {
          sidebar.classList.toggle("close");
          toggleButton.classList.toggle("rotate");

          // optional: simpan status ke localStorage biar ingat saat refresh
          localStorage.setItem(
            "sidebarClosed",
            sidebar.classList.contains("close")
          );
        });

        // ingat posisi terakhir saat reload
        if (
          localStorage !== "undefined" &&
          localStorage.getItem("sidebarClosed") === "true"
        ) {
          sidebar.classList.add("close");
          toggleButton.classList.add("rotate");
        }
      });
    </script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import {
        getAuth,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCTwQ8IlGP_N_-fALBqu5269QlvJ7G8Mrk",
        authDomain: "petricord-f8c54.firebaseapp.com",
        projectId: "petricord-f8c54",
        storageBucket: "petricord-f8c54.firebasestorage.app",
        messagingSenderId: "814472267558",
        appId: "1:814472267558:web:d97ddfd93757a7fe5f63e7",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const PUBLIC_API = "http://localhost:8000/api/cats/devices/public";
      const grid = document.querySelector(".devices-grid");
      let currentDeviceSerial = "";

      function createRealCard(device) {
        const isActive = device.status === "Aktif";
        const battery = device.battery ?? "96";
        const batteryIcon =
          battery === "-"
            ? "../../assets/icons/battery-slash-svgrepo-com.svg"
            : battery >= 75
            ? "../../assets/icons/battery-full-svgrepo-com.svg"
            : battery >= 50
            ? "../../assets/icons/battery-mid-svgrepo-com.svg"
            : battery >= 25
            ? "../../assets/icons/battery-low-svgrepo-com.svg"
            : "../../assets/icons/battery-low-svgrepo-com.svg";

        const savedNames = JSON.parse(
          localStorage.getItem("device_names") || "{}"
        );
        const displayName =
          savedNames[device.serial] || device.nama_perangkat || "Tanpa Nama";

          return `
      <div class="device-card">
              <div class="device-image">
                <img src="${device.photoData || '../../assets/images/default-device.png'}" alt="Perangkat ${displayName}" data-pos="${device.imagePosition || 'center'}" />
          </div>
        <div class="device-name">${displayName}</div>

        <div class="device-info">
          <div class="device-info-left">
            <a href="/pages/owner/monitoring.html?serial=${device.serial}" class="btn btn-sm btn-device-detail">Lihat Detail</a>
          </div>
          <div class="device-info-right btn-group">
            <button type="button" class="btn-edit" data-serial="${device.serial}" data-name="${encodeURIComponent(displayName)}">Edit</button>
            <button type="button" class="btn-delete" data-serial="${device.serial}">Hapus</button>
          </div>
        </div>

        <div class="device-status">
          <div>
            <div class="status-label text-muted">Status</div>
            <div class="status-value">
              <span class="status-badge ${isActive ? "active" : "inactive"}"></span>
              <span>${isActive ? "Aktif" : "Nonaktif"}</span>
            </div>
          </div>
          <div>
            <div class="battery-label text-muted">Baterai</div>
            <div class="battery-percentage">
              <span>${battery}${battery !== "-" ? "%" : ""}</span>
              <img src="${batteryIcon}" alt="Battery" />
            </div>
          </div>
        </div>
      </div>`;
      }
      async function loadDevices() {
        try {
          const res = await fetch(PUBLIC_API);
          if (!res.ok) throw new Error("Server error");
          const devices = await res.json();

          document.getElementById("total-devices").textContent = devices.length;
          const active = devices.filter((d) => d.status === "Aktif").length;
          document.getElementById("total-active-devices").textContent = active;

          grid.innerHTML =
            devices.length === 0
              ? `<p style="width:100%;text-align:center;padding:4rem;color:#999;">Belum ada perangkat terdaftar.</p>`
              : devices.map(createRealCard).join("");

          // after rendering, bind event listeners to the edit/delete buttons
          bindCardButtons();
            // apply per-image positioning (object-position) and ensure one image per device
            setImagePositions();
            // re-apply current search filter so results persist after re-render
            try {
              const qEl = document.getElementById('device-search');
              if (qEl && qEl.value && qEl.value.trim()) filterDevices(qEl.value.trim());
            } catch (e) { /* ignore */ }
        } catch (err) {
          console.error(err);
          grid.innerHTML = `<p style="width:100%;text-align:center;padding:4rem;color:#e74c3c;">Gagal memuat perangkat</p>`;
          document.getElementById("total-devices").textContent = "0";
          document.getElementById("total-active-devices").textContent = "0";
        }
      }

      onAuthStateChanged(auth, (user) => {
        if (!user) {
          location.href = "/Frontend/login.html";
          return;
        }
        document.getElementById("user-name").textContent =
          user.displayName?.split(" ")[0] || user.email.split("@")[0] || "User";
        loadDevices();
        setInterval(loadDevices, 20000);
      });

      window.openEditModal = function (serial, currentName) {
        currentDeviceSerial = serial;
        const input = document.getElementById("editDeviceNameInput");
        if (input) input.value = currentName || "";
        const modalEl = document.getElementById('editDeviceModal');
        if (modalEl) {
          // ensure modal is visible, then trigger the dialog 'show' class for animation
          modalEl.classList.add('visible');
          // small delay to allow visibility to apply before starting transition
          setTimeout(() => {
            modalEl.classList.add('show');
            modalEl.setAttribute('aria-hidden', 'false');
            // focus the input for quicker editing
            setTimeout(() => input && input.focus(), 50);
          }, 20);
        }
      };

      window.closeEditModal = function () {
        const modalEl = document.getElementById('editDeviceModal');
        if (!modalEl) return;
        // remove 'show' to start closing animation, keep 'visible' until animation ends
        modalEl.classList.remove('show');
        const dialog = modalEl.querySelector('.edit-modal-dialog');
        if (!dialog) {
          modalEl.classList.remove('visible');
          modalEl.setAttribute('aria-hidden', 'true');
          return;
        }

        const onEnd = (ev) => {
          if (ev && ev.target !== dialog) return;
          dialog.removeEventListener('transitionend', onEnd);
          modalEl.classList.remove('visible');
          modalEl.setAttribute('aria-hidden', 'true');
        };

        dialog.addEventListener('transitionend', onEnd);
        // fallback in case transitionend doesn't fire
        setTimeout(() => {
          if (modalEl.classList.contains('visible') && !modalEl.classList.contains('show')) {
            dialog.removeEventListener('transitionend', onEnd);
            modalEl.classList.remove('visible');
            modalEl.setAttribute('aria-hidden', 'true');
          }
        }, 400);
      };

      window.saveDeviceName = function () {
        const input = document.getElementById("editDeviceNameInput");
        const newName = input && input.value.trim();
        if (!newName) { alert("Nama tidak boleh kosong!"); return; }
        const savedNames = JSON.parse(localStorage.getItem("device_names") || "{}");
        savedNames[currentDeviceSerial] = newName;
        localStorage.setItem("device_names", JSON.stringify(savedNames));
        loadDevices();
        // hide modal
        window.closeEditModal();

        // simple toast
        const toast = document.createElement("div");
        toast.className = "toast-notif bg-success text-white px-4 py-2 rounded position-fixed";
        toast.style.bottom = '1rem'; toast.style.left = '50%'; toast.style.transform = 'translateX(-50%)'; toast.style.zIndex = 2000;
        toast.textContent = "Nama perangkat berhasil diubah!";
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
      };

      // wire modal save button (in case user clicks it)
      document.addEventListener('DOMContentLoaded', ()=>{
        const saveBtn = document.getElementById('saveDeviceNameBtn');
        if (saveBtn) saveBtn.addEventListener('click', window.saveDeviceName);
      });

      // HAPUS PERANGKAT DARI LOCAL & TAMPILAN
      window.deleteDevice = function (serial) {
        if (!confirm("Yakin ingin menghapus perangkat ini dari daftar?"))
          return;

        const saved = JSON.parse(localStorage.getItem("device_names") || "{}");
        delete saved[serial];
        localStorage.setItem("device_names", JSON.stringify(saved));

        loadDevices(); // refresh semua card + statistik

        // Toast sukses
        const toast = document.createElement("div");
        toast.textContent = "Perangkat berhasil dihapus!";
        toast.className =
          "fixed bottom-8 left-1/2 -translate-x-1/2 bg-red-600 text-white px-8 py-4 rounded-full shadow-2xl z-50";
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
      };

      // bind event listeners for edit/delete buttons rendered inside cards
      function bindCardButtons() {
        // edit buttons
        document.querySelectorAll('.btn-edit').forEach((btn) => {
          btn.removeEventListener('click', onEditClick);
          btn.addEventListener('click', onEditClick);
        });
        // delete buttons
        document.querySelectorAll('.btn-delete').forEach((btn) => {
          btn.removeEventListener('click', onDeleteClick);
          btn.addEventListener('click', onDeleteClick);
        });
      }

      function onEditClick(e) {
        const btn = e.currentTarget;
        const serial = btn.dataset.serial;
        const name = btn.dataset.name ? decodeURIComponent(btn.dataset.name) : '';
        window.openEditModal(serial, name);
      }

      function onDeleteClick(e) {
        const btn = e.currentTarget;
        const serial = btn.dataset.serial;
        window.deleteDevice(serial);
      }

      // Apply per-image positioning after render
      function setImagePositions() {
        document.querySelectorAll('.device-image img').forEach((img) => {
          const pos = img.dataset.pos || 'center';
          // acceptable values: 'center', 'top', 'bottom', 'left', 'right', or 'x% y%'
          img.style.objectPosition = pos;
        });
      }

      // debounce helper
      function debounce(fn, wait) {
        let t = null;
        return function (...args) {
          clearTimeout(t);
          t = setTimeout(() => fn.apply(this, args), wait);
        };
      }

      // filter visible device cards by name (case-insensitive)
      function filterDevices(query) {
        const q = String(query || '').trim().toLowerCase();
        document.querySelectorAll('.device-card').forEach((card) => {
          const nameEl = card.querySelector('.device-name');
          const name = nameEl ? nameEl.textContent.trim().toLowerCase() : '';
          if (!q) {
            card.style.display = '';
          } else {
            card.style.display = name.includes(q) ? '' : 'none';
          }
        });
      }

      const searchInput = document.getElementById('device-search');
      if (searchInput) {
        const handler = debounce((ev) => filterDevices(ev.target.value), 180);
        searchInput.addEventListener('input', handler);
      }
    </script>
  </body>
</html>
