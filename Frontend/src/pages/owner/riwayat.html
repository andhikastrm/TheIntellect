<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riwayat</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body>
  <nav id="sidebar">
    <ul>
      <li>
        <span class="logo">
          <img src="../../assets/images/petricord-logo.svg" style="width: 100px" />
        </span>
        <button onclick="toggleSidebar()" id="toggle-btn">
          <img src="../../assets/icons/double-arrow-right-svgrepo-com.svg" />
        </button>
      </li>
      <li>
        <a href="perangkat.html">
          <img src="../../assets/icons/devices-svgrepo-com-outline.svg" />
          <span>Perangkat</span>
        </a>
      </li>
      <li>
        <a href="notifikasi.html">
          <img src="../../assets/icons/notification-alert-2-svgrepo-com.svg" />
          <span>Notifikasi</span>
        </a>
      </li>
      <li class="active">
        <a href="riwayat.html">
          <img src="../../assets/icons/log.svg" />
          <span>Riwayat</span>
        </a>
      </li>
      <li>
        <a href="jurnal-hewan.html">
          <img src="../../assets/icons/health-svgrepo-com.svg" />
          <span>Jurnal Hewan</span>
        </a>
      </li>
      <li>
        <a href="profil.html">
          <img src="../../assets/icons/user-svgrepo-com.svg" />
          <span>Profil</span>
        </a>
      </li>
    </ul>
  </nav>

  <main>
    <div class="paw-bg">
      <img src="../../assets/images/paw.png" class="paw deco paw-1" alt="" />
      <img src="../../assets/images/paw.png" class="paw deco paw-2" alt="" />
    </div>

    <div class="header-section">
      <h2>Perangkatmu</h2>
      <div class="header-controls">
        <div class="filterByCategory">
          <select id="kategori-riwayat" required>
            <option value="semua-riwayat">Semua riwayat</option>
            <option value="peringatan">Peringatan</option>
            <option value="lainnya">Informasi</option>
          </select>
        </div>

        <div class="filterByDevice">
          <select id="kategori-perangkat" required>
            <option value="semua-perangkat">Semua perangkat</option>
            <option value="peringatan">Perangkat 1</option>
            <option value="lainnya">Perangkat 2</option>
          </select>
        </div>
      </div>
    </div>

    <div class="stats-container">
      <div class="stat-card">
        <div class="stat-content">
          <h3>Gejala Kejang Terdeteksi</h3>
          <div class="filterByRange">
            <select id="filter-range" required>
              <option value="minggu">Minggu ini</option>
              <option value="bulan">Bulan ini</option>
              <option value="tahun">Tahun ini</option>
            </select>
          </div>
          <div class="stat-number" id="kejang">2</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-content">
          <h3>Gejala Muntah Terdeteksi</h3>
          <div class="filterByRange">
            <select id="filter-range" required>
              <option value="minggu">Minggu ini</option>
              <option value="bulan">Bulan ini</option>
              <option value="tahun">Tahun ini</option>
            </select>
          </div>
          <div class="stat-number" id="muntah">1</div>
        </div>
      </div>
    </div>

    <div class="timeline" id="riwayat-list">
      <!-- Riwayat items will be dynamically inserted here -->
    </div>
  </main>

  <script type="module" src="/js/riwayat.js"></script>
  <script>
    // Toggle sidebar (tetap sama)
    const toggleButton = document.getElementById("toggle-btn");
    const sidebar = document.getElementById("sidebar");

    function toggleSidebar() {
      sidebar.classList.toggle("close");
      toggleButton.classList.toggle("rotate");
    }

    // === DATA RIWAYAT ===
    const dataRiwayat = [
      {
        time: "[2025-11-18 15:23:31]",
        type: "peringatan",
        title: "Gejala kejang terdeteksi",
        device: "Pet Patrol Lt 1",
      },
      {
        time: "[2025-11-18 12:50:31]",
        type: "informasi",
        title: "Aktivitas makan terdeteksi",
        device: "Pet Patrol Lt 2",
      },
      {
        time: "[2025-11-18 09:30:02]",
        type: "peringatan",
        title: "Gejala muntah terdeteksi",
        device: "Pet Patrol Lt 3",
      },
      {
        time: "[2025-11-18 08:03:21]",
        type: "informasi",
        title: "Aktivitas makan terdeteksi",
        device: "Pet Patrol Lt 3",
      },
      {
        time: "[2025-11-18 13:05:50]",
        type: "informasi",
        title: "Aktivitas makan terdeteksi",
        device: "Pet Patrol Lt 3",
      },
      {
        time: "[2025-11-18 13:01:35]",
        type: "informasi",
        title: "Aktivitas makan terdeteksi",
        device: "Pet Patrol Lt 1",
      },
      {
        time: "[2025-11-18 09:54:31]",
        type: "peringatan",
        title: "Gejala kejang terdeteksi",
        device: "Pet Patrol Lt 1",
      },
      {
        time: "[2025-11-18 08:27:12]",
        type: "peringatan",
        title: "Gejala kejang terdeteksi",
        device: "Pet Patrol Lt 1",
      },
    ];

    // === UPDATE STATISTIK KEJANG & MUNTAH ===
    function updateStats(filteredData = dataRiwayat) {
      const kejang = filteredData.filter(
        (item) =>
          item.title.includes("kejang") || item.title.includes("Kejang")
      ).length;

      const muntah = filteredData.filter(
        (item) =>
          item.title.includes("muntah") || item.title.includes("Muntah")
      ).length;

      document.getElementById("kejang").textContent = kejang;
      document.getElementById("muntah").textContent = muntah;
    }

    // === ISI DROPDOWN PERANGKAT SECARA DINAMIS ===
    function populateDeviceFilter() {
      const select = document.getElementById("kategori-perangkat");
      // Kosongkan dulu kecuali opsi pertama
      select.innerHTML =
        '<option value="semua-perangkat">Semua perangkat</option>';

      // Ambil semua device unik dari data
      const devices = [
        ...new Set(dataRiwayat.map((item) => item.device)),
      ].sort();

      devices.forEach((dev) => {
        const opt = document.createElement("option");
        opt.value = dev;
        opt.textContent = dev;
        select.appendChild(opt);
      });
    }

    // === RENDER RIWAYAT ===
    function renderRiwayat(items) {
      const container = document.getElementById("riwayat-list");
      container.innerHTML = "";

      // Kelompokkan berdasarkan hari (Hari Ini / Kemarin)
      const groups = { "Hari Ini": [], Kemarin: [] };
      const today = new Date().toISOString().slice(0, 10); // format YYYY-MM-DD

      items.forEach((item) => {
        const itemDate = item.time.match(/\d{4}-\d{2}-\d{2}/)[0];
        const key = itemDate === today ? "Hari Ini" : "Kemarin";
        groups[key].push(item);
      });

      ["Hari Ini", "Kemarin"].forEach((groupName) => {
        if (groups[groupName].length === 0) return;

        const groupDiv = document.createElement("div");
        groupDiv.className = "riwayat-group";
        groupDiv.innerHTML = `
        <hr>
        <div class="group-label">${groupName}</div>
        <hr>
        <div class="timeline">
          ${groups[groupName]
            .map(
              (item) => `
            <div class="timeline-item ${item.type}">
              <div class="timeline-date">${item.time}</div>
              <div class="timeline-title">${item.title}</div>
              <span class="timeline-device">${item.device}</span>
            </div>
          `
            )
            .join("")}
        </div>
      `;
        container.appendChild(groupDiv);
      });

      // Update statistik setelah render
      updateStats(items);
    }

    // === FILTER ===
    function applyFilter() {
      let filtered = dataRiwayat;

      // Filter berdasarkan kategori
      const tipe = document.getElementById("kategori-riwayat").value;
      if (tipe === "peringatan") {
        filtered = filtered.filter((x) => x.type === "peringatan");
      } else if (tipe === "lainnya") {
        filtered = filtered.filter((x) => x.type === "informasi");
      }

      // Filter berdasarkan perangkat
      const device = document.getElementById("kategori-perangkat").value;
      if (device !== "semua-perangkat") {
        filtered = filtered.filter((x) => x.device === device);
      }

      renderRiwayat(filtered);
    }

    // === INISIALISASI ===
    populateDeviceFilter(); // Isi dropdown perangkat secara otomatis
    renderRiwayat(dataRiwayat); // Render pertama kali + hitung statistik

    // Event listener filter
    document
      .getElementById("kategori-riwayat")
      .addEventListener("change", applyFilter);
    document
      .getElementById("kategori-perangkat")
      .addEventListener("change", applyFilter);
  </script>
</body>

</html>
