<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Petricord - Cat Behavior Monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f4a261;
      color: #333;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .main-card {
      width: 95vw;
      max-width: 1400px;
      height: 92vh;
      background: #6b4e31;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .header {
      text-align: center;
      color: #f4a261;
      font-weight: bold;
      font-size: 1.3rem;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .content {
      flex: 1;
      display: flex;
      gap: 24px;
      min-height: 0;
    }

    .camera-section {
      flex: 1;
      background: #3c2f2f;
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.4);
    }

    .camera-title {
      text-align: center;
      font-size: 1.6rem;
      font-weight: bold;
      color: #f4a261;
    }

    .video-container {
      flex: 1;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .controls {
      height: 210px;
      background: #2b1f1f;
      border-radius: 16px;
      border: 5px solid #f4a261;
      box-shadow: 0 0 50px rgba(244, 162, 97, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .sticks-wrapper {
      width: 460px;
      height: 150px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stick {
      width: 150px;
      height: 150px;
      background: rgba(244, 162, 97, 0.25);
      border: 6px solid #f4a261;
      border-radius: 50%;
      position: relative;
      box-shadow: 0 0 60px rgba(244, 162, 97, 1), inset 0 0 40px rgba(244, 162, 97, 0.3);
    }

    .handle {
      width: 68px;
      height: 68px;
      background: #f4a261;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 45px #f4a261;
      transition: transform 0.08s ease-out;
    }

    .dir {
      position: absolute;
      color: #fff;
      font-size: 36px;
      font-weight: bold;
      pointer-events: none;
      text-shadow: 0 0 15px #000;
    }

    .up {
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
    }

    .down {
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
    }

    .left {
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
    }

    .right {
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
    }

    /* === PERBAIKAN UTAMA: KATA "MENUNGGU..." GAK KELUAR BATAS LAGI === */
    .detection-section {
      width: 400px;
      background: #f4a261;
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    .detection-title {
      text-align: center;
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 16px;
      color: #6b4e31;
    }

    .result-box {
      background: #3c2f2f;
      color: #f4a261;
      padding: 40px 20px;
      border-radius: 18px;
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      /* penting! */
    }

    .behavior {
      font-size: 4.2rem;
      /* dikecilin sedikit */
      font-weight: bold;
      margin: 15px 0;
      text-shadow: 0 0 35px rgba(244, 162, 97, 1);
      color: #f4a261;
      word-wrap: break-word;
      /* biar "MENUNGGU..." putus baris kalau kepanjangan */
      overflow-wrap: break-word;
      line-height: 1.1;
      max-width: 100%;
    }

    .confidence {
      font-size: 1.5rem;
      margin: 12px 0;
      color: #a0d468;
    }

    .cat-name {
      font-size: 1.2rem;
      opacity: 0.9;
    }

    .history {
      margin-top: 20px;
      background: #3c2f2f;
      border-radius: 14px;
      padding: 16px;
      max-height: 240px;
      overflow-y: auto;
    }

    .history-title {
      color: #f4a261;
      font-weight: bold;
      margin-bottom: 12px;
      font-size: 1.1rem;
    }

    .log-item {
      background: rgba(244, 162, 97, 0.3);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 0.95rem;
      color: #f4a261;
      border-left: 5px solid #f4a261;
    }
  </style>
</head>

<body>

  <div class="main-card">
    <div class="header">Device ID: <span id="deviceId" class="font-bold">Loading...</span></div>

    <div class="content">
      <div class="camera-section">
        <h2 class="camera-title">Kamera Live</h2>
        <div class="video-container">
          <video id="video" autoplay muted playsinline></video>
        </div>
        <div class="controls">
          <div class="sticks-wrapper">
            <div class="stick" id="leftStick">
              <div class="handle" id="leftHandle"></div>
              <i class="dir up ri-arrow-up-line"></i>
              <i class="dir down ri-arrow-down-line"></i>
              <i class="dir left ri-arrow-left-line"></i>
              <i class="dir right ri-arrow-right-line"></i>
            </div>
            <div class="stick" id="rightStick">
              <div class="handle" id="rightHandle"></div>
              <i class="dir up ri-arrow-up-line"></i>
              <i class="dir down ri-arrow-down-line"></i>
            </div>
          </div>
        </div>
      </div>

      <div class="detection-section">
        <h2 class="detection-title">Hasil Deteksi AI</h2>
        <div class="result-box">
          <div class="behavior" id="behavior">MENUNGGU...</div>
          <div class="confidence" id="confidence">-</div>
          <div class="cat-name" id="catName">Kucing: Unknown</div>
        </div>
        <div class="history">
          <div class="history-title">Riwayat Deteksi Hari Ini</div>
          <div id="historyList"></div>
        </div>
      </div>
    </div>
  </div>

  <canvas id="canvas" style="display:none"></canvas>

  <script>
    const deviceSerial = localStorage.getItem("my_device_serial") || "DEV-" + Date.now().toString(36).toUpperCase();
    localStorage.setItem("my_device_serial", deviceSerial);
    document.getElementById('deviceId').textContent = deviceSerial;

    function setupStick(stick, handle, isLeft = false) {
      let active = false;
      const radius = 48;
      const update = (e) => {
        if (!active) return;
        e.preventDefault();
        const rect = stick.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const clientX = e.clientX || e.touches?.[0]?.clientX || 0;
        const clientY = e.clientY || e.touches?.[0]?.clientY || 0;
        let dx = clientX - cx;
        let dy = clientY - cy;
        if (!isLeft) dx = 0;
        const dist = Math.hypot(dx, dy);
        if (dist > radius) {
          const angle = Math.atan2(dy, dx);
          dx = Math.cos(angle) * radius * (isLeft ? 1 : 0);
          dy = Math.sin(angle) * radius;
        }
        handle.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      };
      const reset = () => {
        active = false;
        handle.style.transform = 'translate(-50%, -50%)';
      };
      stick.addEventListener('mousedown', () => active = true);
      stick.addEventListener('touchstart', (e) => { active = true; update(e); }, { passive: false });
      document.addEventListener('mousemove', update);
      document.addEventListener('touchmove', update, { passive: false });
      document.addEventListener('mouseup', reset);
      document.addEventListener('touchend', reset);
    }
    setupStick(document.getElementById('leftStick'), document.getElementById('leftHandle'), true);
    setupStick(document.getElementById('rightStick'), document.getElementById('rightHandle'), false);

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
    })
      .then(stream => { video.srcObject = stream; video.play(); })
      .catch(err => alert("Kamera gagal: " + err.message));

    const historyList = document.getElementById('historyList');
    const behaviorEl = document.getElementById('behavior');
    const confidenceEl = document.getElementById('confidence');
    const catNameEl = document.getElementById('catName');

    function addToHistory(behavior, confidence, catName) {
      const time = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const item = document.createElement('div');
      item.className = 'log-item';
      item.innerHTML = `<strong>[${time}]</strong> ${behavior} — ${confidence}%<br><small>${catName}</small>`;
      historyList.prepend(item);
      if (historyList.children.length > 12) historyList.removeChild(historyList.lastChild);
    }

    let processing = false;
    async function detect() {
      if (!video.videoWidth || processing) return;
      processing = true;
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      canvas.toBlob(async (blob) => {
        const form = new FormData();
        form.append('image', blob, 'frame.jpg');
        try {
          const res = await fetch("http://127.0.0.1:8000/api/cats/detect-behavior", {
            method: "POST",
            headers: { "X-Device-Serial": deviceSerial },
            body: form
          });
          const data = await res.json();
          if (data.success && data.confidence > 0.45) {
            const b = data.habit.toUpperCase();
            const c = Math.round(data.confidence * 100);
            const cat = data.cat_name || "Unknown";
            behaviorEl.textContent = b;
            confidenceEl.textContent = `Confidence: ${c}%`;
            catNameEl.textContent = `Kucing: ${cat}`;
            addToHistory(b, c, cat);
          } else {
            behaviorEl.textContent = "MENUNGGU...";
            confidenceEl.textContent = "-";
            catNameEl.textContent = "Kucing: Unknown";
          }
        } catch (e) {
          behaviorEl.textContent = "ERROR";
          confidenceEl.textContent = "Koneksi gagal";
        }
        processing = false;
      }, 'image/jpeg', 0.8);
    }

    setInterval(detect, 1300);
  </script>
</body>

</html>
