<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Petricord - Cat Behavior Monitor</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="loadingOverlay" class="loading-overlay">
      <div class="loading-spinner" aria-hidden="true"></div>
      <div class="loading-text">Memuat kamera...</div>
    </div>
    <div class="main-card">
      <div class="header">
        <button id="btnBack" class="btn-back" aria-label="Kembali">← Kembali</button>
        Device ID: <span id="deviceId" class="font-bold">Loading...</span>
      </div>

      <div class="content">
        <div class="camera-section">
          <h2 class="camera-title">Kamera Live</h2>
          <div class="video-container">
            <video id="video" autoplay muted playsinline></video>
          </div>
          <div class="controls">
            <div class="sticks-wrapper">
              <div class="stick" id="leftStick">
                <div class="handle" id="leftHandle"></div>
                <i class="dir up ri-arrow-up-line"></i>
                <i class="dir down ri-arrow-down-line"></i>
                <i class="dir left ri-arrow-left-line"></i>
                <i class="dir right ri-arrow-right-line"></i>
              </div>
              <div class="stick" id="rightStick">
                <div class="handle" id="rightHandle"></div>
                <i class="dir up ri-arrow-up-line"></i>
                <i class="dir down ri-arrow-down-line"></i>
              </div>
            </div>
          </div>
        </div>

        <div class="detection-section">
          <h2 class="detection-title">Hasil Deteksi</h2>
          <div class="result-box">
            <div class="behavior" id="behavior">Menunggu...</div>
            <div class="confidence" id="confidence">-</div>
            <div class="cat-name" id="catName">Kucing: Unknown</div>
          </div>
          <div class="history">
            <div class="history-title">Riwayat Deteksi Hari Ini</div>
            <div id="historyList"></div>
          </div>
        </div>
      </div>
    </div>

    <canvas id="canvas" style="display: none"></canvas>
    <script type="module" src="/js/monitoring.js"></script>
    <script>
      const loadingOverlay = document.getElementById('loadingOverlay');
      function hideLoading() {
        if (!loadingOverlay) return;
        loadingOverlay.classList.add('hidden');
        // remove from flow after transition
        setTimeout(() => {
          if (loadingOverlay && loadingOverlay.parentNode) loadingOverlay.parentNode.removeChild(loadingOverlay);
        }, 400);
      }
      function showLoadingMessage(msg, isError = false) {
        if (!loadingOverlay) return;
        const txt = loadingOverlay.querySelector('.loading-text');
        if (txt) txt.textContent = msg;
        if (isError) loadingOverlay.classList.add('error');
      }
      const deviceSerial =
        localStorage.getItem("my_device_serial") ||
        "DEV-" + Date.now().toString(36).toUpperCase();
      localStorage.setItem("my_device_serial", deviceSerial);
      document.getElementById("deviceId").textContent = deviceSerial;

      // Back button behavior: go to previous page or fallback to homepage
      const backBtn = document.getElementById('btnBack');
      if (backBtn) {
        backBtn.addEventListener('click', (e) => {
          e.preventDefault();
          if (window.history.length > 1) window.history.back();
          else window.location.href = '/';
        });
      }

      function setupStick(stick, handle, isLeft = false) {
        let active = false;
        const radius = 48;
        const update = (e) => {
          if (!active) return;
          e.preventDefault();
          const rect = stick.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const clientX = e.clientX || e.touches?.[0]?.clientX || 0;
          const clientY = e.clientY || e.touches?.[0]?.clientY || 0;
          let dx = clientX - cx;
          let dy = clientY - cy;
          if (!isLeft) dx = 0;
          const dist = Math.hypot(dx, dy);
          if (dist > radius) {
            const angle = Math.atan2(dy, dx);
            dx = Math.cos(angle) * radius * (isLeft ? 1 : 0);
            dy = Math.sin(angle) * radius;
          }
          handle.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        };
        const reset = () => {
          active = false;
          handle.style.transform = "translate(-50%, -50%)";
        };
        stick.addEventListener("mousedown", () => (active = true));
        stick.addEventListener(
          "touchstart",
          (e) => {
            active = true;
            update(e);
          },
          { passive: false }
        );
        document.addEventListener("mousemove", update);
        document.addEventListener("touchmove", update, { passive: false });
        document.addEventListener("mouseup", reset);
        document.addEventListener("touchend", reset);
      }
      setupStick(
        document.getElementById("leftStick"),
        document.getElementById("leftHandle"),
        true
      );
      setupStick(
        document.getElementById("rightStick"),
        document.getElementById("rightHandle"),
        false
      );

      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      navigator.mediaDevices
        .getUserMedia({
          video: {
            facingMode: "environment",
            width: { ideal: 1280 },
            height: { ideal: 720 },
          },
        })
        .then((stream) => {
          video.srcObject = stream;
          // hide loading once video starts playing
          video.addEventListener('playing', () => hideLoading(), { once: true });
          // fallback: if 'playing' doesn't fire, hide after 5s
          setTimeout(() => {
            if (video && video.readyState >= 2) hideLoading();
          }, 5000);
          video.play().catch(() => {
            /* ignore play promise errors, we'll rely on event */
          });
        })
        .catch((err) => {
          console.error('getUserMedia error', err);
          showLoadingMessage('Kamera gagal: ' + (err.message || 'izin ditolak'), true);
        });

      const historyList = document.getElementById("historyList");
      const behaviorEl = document.getElementById("behavior");
      const confidenceEl = document.getElementById("confidence");
      const catNameEl = document.getElementById("catName");

      function addToHistory(behavior, confidence, catName) {
        const time = new Date().toLocaleTimeString("id-ID", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });
        const item = document.createElement("div");
        item.className = "log-item";
        item.innerHTML = `<strong>[${time}]</strong> ${behavior} — ${confidence}%<br><small>${catName}</small>`;
        historyList.prepend(item);
        if (historyList.children.length > 12)
          historyList.removeChild(historyList.lastChild);
      }

      let processing = false;
      async function detect() {
        if (!video.videoWidth || processing) return;
        processing = true;
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        canvas.toBlob(
          async (blob) => {
            const form = new FormData();
            form.append("image", blob, "frame.jpg");
            try {
              const res = await fetch(
                "http://127.0.0.1:8000/api/cats/detect-behavior",
                {
                  method: "POST",
                  headers: { "X-Device-Serial": deviceSerial },
                  body: form,
                }
              );
              const data = await res.json();
              if (data.success && data.confidence > 0.45) {
                const b = data.habit.toUpperCase();
                const c = Math.round(data.confidence * 100);
                const cat = data.cat_name || "Unknown";
                behaviorEl.textContent = b;
                confidenceEl.textContent = `Confidence: ${c}%`;
                catNameEl.textContent = `Kucing: ${cat}`;
                addToHistory(b, c, cat);
              } else {
                behaviorEl.textContent = "Menunggu...";
                confidenceEl.textContent = "-";
                catNameEl.textContent = "Kucing: Unknown";
              }
            } catch (e) {
              behaviorEl.textContent = "ERROR";
              confidenceEl.textContent = "Koneksi gagal";
            }
            processing = false;
          },
          "image/jpeg",
          0.8
        );
      }

      setInterval(detect, 1300);
    </script>
  </body>
</html>
