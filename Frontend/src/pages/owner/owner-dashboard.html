    body {
      font-family: 'Poppins', sans-serif;
      background: #f8f9fc;
    }

      position: fixed;
      inset: 0;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><path fill="%23e5e7eb" opacity="0.3" d="M100 20c-22 0-40 18-40 40s18 40 40 40 40-18 40-40-18-40-40-40zm0 100c-33 0-60 27-60 60s27 33 60 60 60 60s33-27 60-60-27-60-60-60z"/></svg>') center/800px no-repeat;
      pointer-events: none;
    }

    .sidebar {
      width: 280px;
      background: #fff;
      box-shadow: 2px 0 15px rgba(0, 0, 0, 0.08);
    }

    .btn-gold {
      background: linear-gradient(to right, #d4a017, #f4d03f);
      color: white;
    }

    .btn-gold:hover {
      background: linear-gradient(to right, #b8860b, #e6c200);
    }

    .card-cat {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      transition: all 0.3s;
    }

    .card-cat:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }

      height: 200px;

<body class="min-h-screen flex">
  <div class="paw-bg"></div>

  <!-- Sidebar -->
  <aside class="sidebar fixed h-full flex flex-col">
    <div class="p-6 text-center">
      <h1 class="text-3xl font-bold">Petric<span class="text-amber-600">ord</span></h1>
    </div>
    <nav class="flex-1 px-4">
      <a href="/Frontend/dashboard.html"
        class="flex items-center gap-4 py-4 px-5 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-500 text-white mb-2">
        <i class="bi bi-house-door-fill text-xl"></i><span class="font-medium">Perangkat</span>
      </a>
      <a href="#" class="flex items-center gap-4 py-4 px-5 rounded-xl text-gray-700 hover:bg-gray-100"><i
          class="bi bi-bell"></i> Notifikasi</a>
      <a href="#" class="flex items-center gap-4 py-4 px-5 rounded-xl text-gray-700 hover:bg-gray-100"><i
          class="bi bi-clock-history"></i> Riwayat</a>
      <a href="#" class="flex items-center gap-4 py-4 px-5 rounded-xl text-gray-700 hover:bg-gray-100"><i
          class="bi bi-journal-text"></i> Jurnal Hewan</a>
      <a href="#" class="flex items-center gap-4 py-4 px-5 rounded-xl text-gray-700 hover:bg-gray-100"><i
          class="bi bi-gear"></i> Pengaturan</a>
      <a href="#" class="flex items-center gap-4 py-4 px-5 rounded-xl text-gray-700 hover:bg-gray-100"><i
          class="bi bi-person"></i> Profil</a>
    </nav>
    <div class="p-6">
      <button onclick="logout()"
        class="w-full bg-red-500 hover:bg-red-600 text-white py-3 rounded-full font-medium transition">
        Keluar
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 ml-72 p-8">
    <header class="flex justify-between items-center mb-8">
      <div>
        <h2 class="text-3xl font-bold">Perangkatmu</h2>
        <p class="text-gray-600">Hi, <span id="user-name">Cordian</span>! Meow meow</p>
      </div>
      <button onclick="location.href='/frontend/add-cat.html'"
        class="btn-gold px-6 py-3 rounded-full font-medium flex items-center gap-2">
        <i class="bi bi-plus-lg"></i> Tambah Perangkat
      </button>
    </header>

    <!-- TOTAL & AKTIF -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
      <div class="bg-white rounded-2xl p-6 shadow-sm border">
        <div class="flex justify-between items-center">
          <div>
            <p class="text-gray-600">Total Perangkat</p>
            <p class="text-3xl font-bold" id="total-cats">0</p>
          </div>
          <i class="bi bi-heart-fill text-4xl text-pink-500"></i>
        </div>
      </div>
      <div class="bg-white rounded-2xl p-6 shadow-sm border">
        <div class="flex justify-between items-center">
          <div>
            <p class="text-gray-600">Perangkat Aktif</p>
            <p class="text-3xl font-bold text-green-600" id="active-cats">0</p>
          </div>
          <i class="bi bi-check-circle-fill text-4xl text-green-500"></i>
        </div>
      </div>
    </div>

    <!-- DAFTAR KUCING -->
    <div id="cat-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- KUCING AKAN MUNcul DI SINI -->
    </div>
  </main>

  <!-- SCRIPT FIREBASE + FETCH KUCING -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCTwQ8IlGP_N_-fALBqu5269QlvJ7G8Mrk",
      authDomain: "petricord-f8c54.firebaseapp.com",
      projectId: "petricord-f8c54",
      storageBucket: "petricord-f8c54.firebasestorage.app",
      messagingSenderId: "814472267558",
      appId: "1:814472267558:web:d97ddfd93757a7fe5f63e7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        location.href = "/Frontend/login.html";
        return;
      }

      document.getElementById("user-name").textContent = user.displayName?.split(" ")[0] || "Cordian";

      const token = await user.getIdToken(); // fresh token

      try {
        const res = await fetch("/api/cats/", {
          headers: { "Authorization": `Bearer ${token}` }
        });

        if (!res.ok) throw new Error("Gagal ambil data");

        const cats = await res.json();

        document.getElementById("total-cats").textContent = cats.length;
        document.getElementById("active-cats").textContent = cats.length;

        const container = document.getElementById("cat-container");
        container.innerHTML = ""; // kosongin dulu

        if (cats.length === 0) {
          container.innerHTML = `
            <div class="col-span-full text-center py-20">
              <div class="card-cat max-w-md mx-auto p-12">
                <div class="w-32 h-32 bg-gradient-to-br from-amber-400 to-yellow-500 rounded-full flex items-center justify-center mx-auto mb-6">
                  <i class="bi bi-emoji-frown text-6xl text-white"></i>
                </div>
                <h3 class="text-2xl font-bold mb-3">Belum ada kucing</h3>
                <p class="text-gray-600 mb-6">Yuk tambah kucing kesayanganmu!</p>
                <button onclick="location.href='/frontend/add-cat.html'" class="btn-gold px-8 py-4 rounded-full text-lg">
                  Tambah Kucing Pertama
                </button>
              </div>
            </div>
          `;
          return;
        }

        cats.forEach(cat => {
          const fotoUrl = cat.foto ? `/static/uploads/${cat.foto}` : "https://via.placeholder.com/300x200/ddd/999?text=Meong";
          container.innerHTML += `
            <div class="card-cat overflow-hidden">
              <img src="${fotoUrl}" alt="${cat.nama}" class="w-full cat-img">
              <div class="p-6">
                <h3 class="text-2xl font-bold mb-2">${cat.nama}</h3>
                <p class="text-gray-600 mb-4">
                  ${cat.ras || "Kampung"} • Usia: ${cat.usia} • ${cat.berat_badan} kg
                </p>
                <div class="flex gap-3">
                  <button class="flex-1 bg-amber-500 hover:bg-amber-600 text-white py-3 rounded-xl font-medium">
                    Lihat Detail
                  </button>
                  <button class="px-4 bg-gray-200 hover:bg-gray-300 rounded-xl">
                    <i class="bi bi-three-dots"></i>
                  </button>
                </div>
              </div>
            </div>
          `;
        });

      } catch (err) {
        console.error(err);
        Swal.fire("Error", "Gagal memuat data kucing", "error");
      }
    });
  </script>
  <script>
    function logout() {
      localStorage.removeItem("access_token");
      localStorage.removeItem("user_name");
      localStorage.removeItem("user_email");
      localStorage.removeItem("user_id");        
      localStorage.removeItem("role");          
      window.location.href = "/login?logout=true";
    }
  </script>
