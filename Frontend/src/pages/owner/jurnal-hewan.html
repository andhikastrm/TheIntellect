<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jurnal Hewan</title>
  </head>
  <title>Perangkat</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <body>
    <nav id="sidebar">
      <ul>
        <li>
          <span class="logo">
            <img
              src="../../assets/images/petricord-logo.svg"
              style="width: 100px"
            />
          </span>
          <button onclick="toggleSidebar()" id="toggle-btn">
            <img src="../../assets/icons/double-arrow-right-svgrepo-com.svg" />
          </button>
        </li>
        <li>
          <a href="perangkat.html">
            <img src="../../assets/icons/devices-svgrepo-com-outline.svg" />
            <span>Perangkat</span>
          </a>
        </li>
        <li>
          <a href="notifikasi.html">
            <img
              src="../../assets/icons/notification-alert-2-svgrepo-com.svg"
            />
            <span>Notifikasi</span>
          </a>
        </li>
        <li>
          <a href="riwayat.html">
            <img src="../../assets/icons/log.svg" />
            <span>Riwayat</span>
          </a>
        </li>
        <li class="active">
          <a href="#">
            <img src="../../assets/icons/health-svgrepo-com.svg" />
            <span>Jurnal Hewan</span>
          </a>
        </li>
        <li>
          <a href="profil.html">
            <img src="../../assets/icons/user-svgrepo-com.svg" />
            <span>Profil</span>
          </a>
        </li>
      </ul>
    </nav>
    <main>
      <div class="paw-bg">
        <img src="../../assets/images/paw.png" class="paw deco paw-1" alt="" />
        <img src="../../assets/images/paw.png" class="paw deco paw-2" alt="" />
      </div>
      <div class="header-section">
        <h2>Jurnal Hewan</h2>
      </div>
      <p class="text-gray-500">
        Simpan catatan kesehatan hewan peliharaanmu dengan mudah di sini!
      </p>

      <!-- Kelola Hewan removed from this page -->

      <!-- Rekaman Medis - Full width -->
      <section class="rekaman-medis section-full">
        <div class="section-inner">
          <div class="section-header">
            <h3>Rekaman Medis</h3>
            <div class="actions">
              <button id="btn-add-record" class="btn-add-record">
                Tambah Rekaman
              </button>
            </div>
          </div>

          <div class="records-list">
            <table class="records-table">
              <thead>
                <tr>
                  <th>Hewan</th>
                  <th>Tipe</th>
                  <th>Tanggal</th>
                  <th>Catatan</th>
                </tr>
              </thead>
              <tbody id="records-tbody">
                <!-- Rows populated by JS -->
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- Aktivitas (To-do list) - Full width -->
      <section class="aktivitas section-full">
        <div class="section-inner">
          <div class="section-header">
            <h3>Aktivitas (To-do list)</h3>
            <div class="actions">
              <select id="filter-cat" class="select-cat">
                <option value="" disabled selected>Pilih hewan</option>
              </select>
              <button id="btn-add-activity" class="btn-add-activity">
                Tambah Aktivitas
              </button>
            </div>
          </div>

          <div class="todo-list">
            <ul id="activities-ul">
              <!-- Items populated by JS -->
            </ul>
          </div>
        </div>
      </section>

      <!-- Modals / Forms (hidden by default) -->
      <div id="modal-overlay" class="modal-overlay hidden"></div>

      <!-- Cat modal removed (Kelola Hewan removed) -->

      <!-- Add Medical Record Modal -->
      <div
        id="modal-record"
        class="modal hidden"
        role="dialog"
        aria-modal="true"
      >
        <div class="modal-content">
          <h4>Tambah Rekaman Medis</h4>
          <form id="form-record">
            <label
              >Hewan:
              <select name="catId" id="record-cat-select" required>
                <!-- Filled by JS -->
              </select>
            </label>
            <label
              >Tipe Rekaman:
              <select name="type" id="record-type" required>
                <option value="vaksin">Vaksin</option>
                <option value="grooming">Grooming</option>
                <option value="checkup">Pemeriksaan Rutin (Check-up)</option>
              </select>
            </label>
            <label>Tanggal:<input name="date" type="date" required /></label>
            <label>Catatan:<textarea name="notes"></textarea></label>
            <div class="modal-actions">
              <button type="submit" class="btn btn-primary">Simpan</button>
              <button
                type="button"
                id="btn-cancel-record"
                class="btn-cancel-record"
              >
                Batal
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Add Activity Modal -->
      <div
        id="modal-activity"
        class="modal hidden"
        role="dialog"
        aria-modal="true"
      >
        <div class="modal-content">
          <h4>Tambah Aktivitas</h4>
          <form id="form-activity">
            <label
              >Hewan:
              <select name="catId" id="activity-cat-select" required>
                <!-- Filled by JS -->
              </select>
            </label>
            <label>Deskripsi:<input name="text" required /></label>
            <label>Tanggal:<input name="date" type="date" /></label>
            <div class="modal-actions">
              <button type="submit" class="btn btn-primary">Simpan</button>
              <button
                type="button"
                id="btn-cancel-activity"
                class="btn-cancel-activity"
              >
                Batal
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
    <script type="module" src="/js/jurnal-hewan.js"></script>
    <script>
      // Toggle sidebar – versi anti-gagal
      document.addEventListener("DOMContentLoaded", () => {
        const toggleButton = document.getElementById("toggle-btn");
        const sidebar = document.getElementById("sidebar");

        if (!toggleButton || !sidebar) {
          console.warn("Tombol atau sidebar nggak ketemu!");
          return;
        }

        toggleButton.addEventListener("click", () => {
          sidebar.classList.toggle("close");
          toggleButton.classList.toggle("rotate");

          // optional: simpan status ke localStorage biar ingat saat refresh
          localStorage.setItem(
            "sidebarClosed",
            sidebar.classList.contains("close")
          );
        });

        // ingat posisi terakhir saat reload
        if (
          localStorage !== "undefined" &&
          localStorage.getItem("sidebarClosed") === "true"
        ) {
          sidebar.classList.add("close");
          toggleButton.classList.add("rotate");
        }
      });
    </script>

    <!-- App logic for jurnal-hewan: UI + placeholder API handlers -->
    <script>
      // Placeholder API functions (records & activities). Replace with real calls.
      const API = {
        async fetchCats() { return []; },
        async fetchRecords() { return []; },
        async createRecord(r) { return r; },
        async fetchActivities() { return []; },
        async createActivity(a) { return a; }
      };

      const state = { cats: [], records: [], activities: [] };

      function showModal(id) { document.getElementById('modal-overlay').classList.remove('hidden'); document.getElementById(id).classList.remove('hidden'); }
      function closeModal(id) { document.getElementById('modal-overlay').classList.add('hidden'); document.getElementById(id).classList.add('hidden'); }

      function renderRecords() {
        const tbody = document.getElementById('records-tbody');
        tbody.innerHTML = '';
        state.records.forEach(r => {
          const cat = state.cats.find(c => c.id === r.catId) || { name: 'Tidak diketahui' };
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${cat.name}</td><td>${r.type}</td><td>${r.date}</td><td>${r.notes||''}</td>`;
          tbody.appendChild(tr);
        });
      }

      function renderActivities(filterCatId='') {
        const ul = document.getElementById('activities-ul');
        ul.innerHTML = '';
        const list = state.activities.filter(a => !filterCatId || a.catId === filterCatId);
        list.forEach(a => {
          const cat = state.cats.find(c => c.id === a.catId) || { name: 'Tidak diketahui' };
          const li = document.createElement('li');
          li.innerHTML = `<div class="activity-item"><div class="left"><strong>${cat.name}</strong> - ${a.text}</div><div class="right"><button class="btn done" data-id="${a.id}">Selesai</button></div></div>`;
          ul.appendChild(li);
        });
      }

      function updateCatDropdowns() {
        const selects = [document.getElementById('record-cat-select'), document.getElementById('activity-cat-select'), document.getElementById('filter-cat')];
        selects.forEach(sel => {
          if (!sel) return;
          const current = sel.value;
          sel.innerHTML = '<option value="" disabled selected>- Pilih Hewan -</option>';
          state.cats.forEach(c => {
            const opt = document.createElement('option'); opt.value = c.id; opt.textContent = c.name; sel.appendChild(opt);
          });
          sel.value = current;
        });
      }

      function genId(prefix='id'){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

      document.addEventListener('DOMContentLoaded', async () => {
        state.cats = await API.fetchCats();
        state.records = await API.fetchRecords();
        state.activities = await API.fetchActivities();

        renderRecords();
        renderActivities();

        // Records
        document.getElementById('btn-add-record')?.addEventListener('click', ()=>{ document.getElementById('form-record').reset(); updateCatDropdowns(); showModal('modal-record'); });
        document.getElementById('btn-cancel-record')?.addEventListener('click', ()=> closeModal('modal-record'));
        document.getElementById('form-record')?.addEventListener('submit', async (e)=>{
          e.preventDefault(); const fd = new FormData(e.target); const rec = { id: genId('rec'), catId: fd.get('catId'), type: fd.get('type'), date: fd.get('date'), notes: fd.get('notes') }; const created = await API.createRecord(rec); state.records.push(created); renderRecords(); closeModal('modal-record');
        });

        // Activities
        document.getElementById('btn-add-activity')?.addEventListener('click', ()=>{ document.getElementById('form-activity').reset(); updateCatDropdowns(); showModal('modal-activity'); });
        document.getElementById('btn-cancel-activity')?.addEventListener('click', ()=> closeModal('modal-activity'));
        document.getElementById('form-activity')?.addEventListener('submit', async (e)=>{ e.preventDefault(); const fd = new FormData(e.target); const act = { id: genId('act'), catId: fd.get('catId'), text: fd.get('text'), date: fd.get('date') }; const created = await API.createActivity(act); state.activities.push(created); renderActivities(document.getElementById('filter-cat').value); closeModal('modal-activity'); });

        document.getElementById('activities-ul')?.addEventListener('click', (e)=>{ const btn = e.target.closest('button.done'); if (!btn) return; const id = btn.dataset.id; state.activities = state.activities.filter(a=>a.id !== id); renderActivities(document.getElementById('filter-cat').value); });

        document.getElementById('filter-cat')?.addEventListener('change', (e)=>{ renderActivities(e.target.value); });
      });
    </script>
  </body>
</html>
