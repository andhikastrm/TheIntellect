<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Petricord - Jurnal Hewan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      background: linear-gradient(135deg, #fdfcfb, #e2e2ff);
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
    }

    .sidebar {
      width: 280px;
      background: white;
      box-shadow: 10px 0 30px rgba(0, 0, 0, 0.1);
      position: fixed;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 10;
    }

    .content {
      margin-left: 280px;
      padding: 40px;
    }

    .btn-gold {
      background: linear-gradient(45deg, #f59e0b, #d97706);
      color: white;
    }

    .btn-gold:hover {
      background: linear-gradient(45deg, #d97706, #b45309);
    }

    .card-cat {
      background: white;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      transition: all 0.3s;
    }

    .card-cat:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }

    .cat-img {
      height: 200px;
      object-fit: cover;
      border-radius: 24px 24px 0 0;
    }
  </style>
</head>

<body class="text-gray-800">

  <!-- SIDEBAR -->
  <div class="sidebar p-8 flex flex-col justify-between">
    <div>
      <h1 class="text-4xl font-bold text-amber-600 mb-12">Petricord</h1>
      <nav class="space-y-4">
        <a href="owner-dashboard.html"
          class="flex items-center gap-4 text-gray-600 hover:text-amber-600 py-3 px-4 rounded-xl transition">
          <i class="bi bi-house-door text-xl"></i> Perangkat
        </a>
        <a href="#" class="flex items-center gap-4 text-amber-600 bg-amber-50 py-3 px-4 rounded-xl font-bold">
          <i class="bi bi-journal-text text-xl"></i> Jurnal Hewan
        </a>
        <a href="#" class="flex items-center gap-4 text-gray-600 hover:text-amber-600 py-3 px-4 rounded-xl transition">
          <i class="bi bi-bell text-xl"></i> Notifikasi
        </a>
        <a href="#" class="flex items-center gap-4 text-gray-600 hover:text-amber-600 py-3 px-4 rounded-xl transition">
          <i class="bi bi-clock-history text-xl"></i> Riwayat
        </a>
        <a href="#" class="flex items-center gap-4 text-gray-600 hover:text-amber-600 py-3 px-4 rounded-xl transition">
          <i class="bi bi-gear text-xl"></i> Pengaturan
        </a>
        <a href="#" class="flex items-center gap-4 text-gray-600 hover:text-amber-600 py-3 px-4 rounded-xl transition">
          <i class="bi bi-person text-xl"></i> Profil
        </a>
      </nav>
    </div>
    <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white py-4 rounded-full font-bold">
      Keluar
    </button>
  </div>

  <!-- MAIN CONTENT -->
  <div class="content">
    <div class="flex justify-between items-center mb-10">
      <div>
        <h2 class="text-4xl font-bold">Jurnal Hewan</h2>
        <p class="text-gray-600 mt-2">Kelola semua kucing kesayanganmu di sini</p>
      </div>
      <button onclick="openAddCatModal()"
        class="btn-gold px-8 py-4 rounded-full text-lg font-bold shadow-lg hover:shadow-xl transition flex items-center gap-3">
        <i class="bi bi-plus-lg"></i> Tambah Kucing Baru
      </button>
    </div>

    <!-- Daftar Kucing -->
    <div id="catsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
      <!-- Kucing akan muncul di sini -->
    </div>

    <!-- Kosong State -->
    <div id="emptyState" class="text-center py-20 hidden">
      <i class="bi bi-emoji-frown text-9xl text-gray-300"></i>
      <h3 class="text-3xl font-bold text-gray-500 mt-8">Belum ada kucing terdaftar</h3>
      <p class="text-gray-500 mt-4">Yuk tambah kucing pertamamu!</p>
    </div>
  </div>

  <script>
    // Cek login
    const userName = localStorage.getItem("user_name") || "Cordian";
    document.title = `Petricord - Jurnal ${userName}`;

    // Logout
    function logout() {
      localStorage.clear();
      firebase.auth().signOut();
      window.location.href = "login.html";
    }

    // Load daftar kucing
    async function loadCats() {
      const container = document.getElementById("catsContainer");
      const emptyState = document.getElementById("emptyState");
      container.innerHTML = "";

      try {
        const token = localStorage.getItem("access_token");
        if (!token) throw "No token";

        const res = await fetch("/api/cats/", {
          headers: { "Authorization": `Bearer ${token}` }
        });

        const cats = await res.json();

        if (!cats || cats.length === 0) {
          emptyState.classList.remove("hidden");
          return;
        }

        emptyState.classList.add("hidden");

        cats.forEach(cat => {
          const fotoUrl = cat.foto ? cat.foto.startsWith("http") ? cat.foto : `/static/uploads/${cat.foto}` : "https://via.placeholder.com/300x200/ddd/999?text=Meong";
          container.innerHTML += `
            <div class="card-cat overflow-hidden">
              <img src="${fotoUrl}" alt="${cat.nama}" class="w-full cat-img">
              <div class="p-6">
                <h3 class="text-2xl font-bold mb-2">${cat.nama}</h3>
                <p class="text-gray-600 mb-4">
                  ${cat.ras || "Kampung"} • ${cat.usia || "?"} • ${cat.berat_badan || "?"} kg
                </p>
                <div class="flex gap-3">
                  <button onclick="viewDetail(${cat.id})" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white py-3 rounded-xl font-medium">
                    Lihat Detail
                  </button>
                  <button class="px-4 bg-gray-200 hover:bg-gray-300 rounded-xl">
                    <i class="bi bi-three-dots"></i>
                  </button>
                </div>
              </div>
            </div>
          `;
        });
      } catch (err) {
        console.error(err);
        Swal.fire("Error", "Gagal memuat data kucing", "error");
      }
    }

    // Modal Tambah Kucing
    async function openAddCatModal() {
      const { value: formValues } = await Swal.fire({
        title: "Tambah Kucing Baru",
        html: `
          <input id="swal-nama" class="swal2-input" placeholder="Nama Kucing" required>
          <input id="swal-ras" class="swal2-input" placeholder="Ras (opsional)">
          <input id="swal-usia" class="swal2-input" placeholder="Usia (contoh: 2 tahun)">
          <input id="swal-berat" class="swal2-input" placeholder="Berat Badan (kg)">
          <input type="file" id="swal-foto" accept="image/*" class="swal2-file">
        `,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: "Simpan Kucing",
        preConfirm: () => {
          const nama = document.getElementById("swal-nama").value.trim();
          if (!nama) {
            Swal.showValidationMessage("Nama kucing wajib diisi");
            return false;
          }
          return {
            nama,
            ras: document.getElementById("swal-ras").value || "Kampung",
            usia: document.getElementById("swal-usia").value || "Tidak diketahui",
            berat: document.getElementById("swal-berat").value || "0",
            foto: document.getElementById("swal-foto").files[0]
          };
        }
      });

      if (formValues) {
        const formData = new FormData();
        formData.append("nama", formValues.nama);
        formData.append("ras", formValues.ras);
        formData.append("usia", formValues.usia);
        formData.append("berat_badan", formValues.berat);
        if (formValues.foto) formData.append("foto", formValues.foto);

        try {
          const token = localStorage.getItem("access_token");
          const res = await fetch("/api/cats/", {
            method: "POST",
            headers: { "Authorization": `Bearer ${token}` },
            body: formData
          });

          if (res.ok) {
            Swal.fire("Sukses!", `${formValues.nama} berhasil ditambahkan!`, "success");
            loadCats(); // Refresh daftar
          } else {
            const err = await res.json();
            Swal.fire("Gagal", err.detail || "Gagal menyimpan kucing", "error");
          }
        } catch (err) {
          Swal.fire("Error", "Koneksi gagal", "error");
        }
      }
    }

    function viewDetail(id) {
      alert("Detail kucing ID: " + id + " (fitur coming soon)");
    }

    // Load saat halaman dibuka
    window.onload = loadCats;
  </script>
</body>

</html>
