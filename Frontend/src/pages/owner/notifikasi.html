<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notifikasi Kucing</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>

</head>
<body class="bg-[#fdfcf9] text-gray-800">

  <nav id="sidebar">
    <!-- sidebar lo tetap -->
    <ul>
      <li>
        <span class="logo"><img src="../../assets/images/petricord-logo.svg" style="width: 100px"/></span>
        <button onclick="toggleSidebar()" id="toggle-btn"><img src="../../assets/icons/double-arrow-right-svgrepo-com.svg" /></button>
      </li>
      <li><a href="perangkat.html"><img src="../../assets/icons/devices-svgrepo-com-outline.svg" /><span>Perangkat</span></a></li>
      <li class="active"><a href="notifikasi.html"><img src="../../assets/icons/notification-alert-2-svgrepo-com.svg" /><span>Notifikasi</span></a></li>
      <li><a href="riwayat.html"><img src="../../assets/icons/log.svg" /><span>Riwayat</span></a></li>
      <li><a href="jurnal-hewan.html"><img src="../../assets/icons/health-svgrepo-com.svg" /><span>Jurnal Hewan</span></a></li>
      <li><a href="profil.html"><img src="../../assets/icons/user-svgrepo-com.svg" /><span>Profil</span></a></li>
    </ul>
  </nav>

  <main class="p-8 min-h-screen">
    <div class="paw-bg">
      <img src="../../assets/images/paw.png" class="paw deco paw-1" alt=""/>
      <img src="../../assets/images/paw.png" class="paw deco paw-2" alt=""/>
    </div>

    <div class="header-section flex justify-between items-center mb-8">
      <div class="max-w-7xl mx-auto content-wrap">
        <div>
          <h2 class="text-4xl font-bold text-[#6b4e31]">Notifikasi Terkini</h2>
          <p class="text-gray-600 mt-1">Status aktivitas kucing kesayanganmu • Update otomatis</p>
        </div>
        <select id="kategori" class="px-5 py-3 rounded-xl border border-gray-300 bg-white shadow-md text-sm font-medium">
          <option value="semua">Semua Kategori</option>
          <option value="peringatan">Peringatan</option>
          <option value="informasi">Informasi</option>
        </select>
      </div>
    </div>

    <div class="max-w-7xl mx-auto content-wrap">

      <div class="notifikasi-container" id="notifikasi-container">
        <!-- Notifikasi akan di-inject otomatis -->
      </div>

      <div id="empty-state" class="text-center py-20 hidden">
        <i class="ri-emotion-happy-line text-8xl text-gray-300 mb-6"></i>
        <p class="text-2xl font-semibold text-gray-600">Semua aman!</p>
        <p class="text-gray-500">Belum ada aktivitas terdeteksi saat ini.</p>
      </div>
    </div>
  </main>
  <script type="module" src="/js/notifikasi.js"></script>
  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      const toggleButton = document.getElementById("toggle-btn");
      const main = document.querySelector('main');
      sidebar.classList.toggle("close");
      if (toggleButton) toggleButton.classList.toggle("rotate");
      if (main) main.style.marginLeft = sidebar.classList.contains("close") ? "78px" : "250px";
    }

    // Ensure main margin matches sidebar initial state
    document.addEventListener('DOMContentLoaded', () => {
      const sidebar = document.getElementById('sidebar');
      const main = document.querySelector('main');
      if (main && sidebar) main.style.marginLeft = sidebar.classList.contains('close') ? '78px' : '250px';
    });

    // Mapping ikon & judul cerdas
    const behaviorConfig = {
      "kejang": { icon: "ri-alert-fill", title: "Gejala Kejang Terdeteksi!", color: "red", critical: true },
      "muntah": { icon: "ri-emotion-unhappy-line", title: "Kucing Muntah!", color: "red", critical: true },
      "makan": { icon: "ri-restaurant-line", title: "Kucing Sedang Makan", color: "green" },
      "minum": { icon: "ri-cup-line", title: "Kucing Sedang Minum", color: "blue" },
      "tidur": { icon: "ri-hotel-bed-line", title: "Kucing Tidur Nyenyak", color: "purple" },
      "bermain": { icon: "ri-gamepad-line", title: "Kucing Sedang Bermain", color: "yellow" },
      "buang air": { icon: "ri-recycle-line", title: "Kucing Buang Air", color: "orange" },
      "grooming": { icon: "ri-sparkling-2-line", title: "Kucing Membersihkan Diri", color: "pink" },
      "default": { icon: "ri-paw-line", title: (b) => `${b} Terdeteksi`, color: "gray" }
    };

    async function loadNotifikasi() {
    try {
      const res = await fetch("http://localhost:8000/api/cats/activities/latest-by-behavior");
      if (!res.ok) throw new Error("Server mati bro");
      const data = await res.json();
      const logs = data.activities || [];

      const container = document.getElementById("notifikasi-container");
      container.innerHTML = "";
      container.className = "space-y-6"; // ini yang bikin rapi!

      if (logs.length === 0) {
        container.innerHTML = `<div class="text-center py-20 text-gray-500 text-xl">Belum ada aktivitas terdeteksi</div>`;
        return;
      }

      // Urutkan: critical dulu, lalu terbaru
      logs
        .sort((a, b) => {
          const aCrit = ["kejang", "muntah"].includes(a.behavior.toLowerCase());
          const bCrit = ["kejang", "muntah"].includes(b.behavior.toLowerCase());
          if (aCrit && !bCrit) return -1;
          if (!aCrit && bCrit) return 1;
          return new Date(b.timestamp) - new Date(a.timestamp);
        })
        .forEach(log => {
          const behavior = log.behavior.toLowerCase();
          const isCritical = ["kejang", "muntah"].includes(behavior);

          // Judul cerdas
          let title = log.behavior;
          if (behavior === "kejang") title = "Gejala kejang terdeteksi!";
          else if (behavior === "muntah") title = "Kucing muntah!";
          else if (behavior === "makan") title = "Kucing sedang makan";
          else if (behavior === "buang air") title = "Kucing buang air";
          else if (behavior === "minum") title = "Kucing sedang minum";
          else title = `${log.behavior} terdeteksi`;

          const timeAgo = timeSince(new Date(log.timestamp));

          const card = document.createElement("div");
          card.className = `notifikasi-item bg-white rounded-2xl shadow-lg overflow-hidden border-l-4 ${
            isCritical ? "border-red-500" : "border-[#f4a261]"
          }`;

          card.dataset.category = isCritical ? "peringatan" : "informasi";

          card.innerHTML = `
            <div class="p-6">
              <div class="flex justify-between items-start mb-3">
                <div class="flex items-center gap-3">
                  <div class="text-3xl">
                    <i class="ri-${isCritical ? "alert-fill text-red-500" : "checkbox-circle-fill text-green-500"}"></i>
                  </div>
                  <div>
                    <div class="text-xs font-bold uppercase tracking-wider text-gray-500">
                      ${isCritical ? "PERINGATAN" : "INFORMASI"}
                    </div>
                    <h3 class="text-xl font-bold text-[#6b4e31] mt-1">${title}</h3>
                  </div>
                </div>
                <span class="text-sm text-gray-500">${timeAgo}</span>
              </div>

              <div class="flex items-center gap-2 text-sm text-gray-600">
                <i class="ri-device-line"></i>
                <span>${log.custom_name || "Kamera Utama"}</span>
              </div>

              <div class="mt-3 text-sm">
                <span class="text-gray-600">Confidence:</span>
                <span class="font-bold text-[#6b4e31] ml-1">${log.confidence.toFixed(1)}%</span>
              </div>
            </div>
          `;

          container.appendChild(card); // append biar urutan bener (critical di atas)

          // Alarm cuma sekali
          if (isCritical) {
            if (!localStorage.getItem("alerted_" + log.id)) {
              new Audio("https://assets.mixkit.co/sfx/preview/mixkit-alarm-tone-1077.mp3")
                .play().catch(() => {});
              localStorage.setItem("alerted_" + log.id, "true");
            }
          }
        });

    } catch (e) {
      console.error("Error:", e);
      document.getElementById("notifikasi-container").innerHTML = 
        `<div class="text-center py-10 text-red-600">Gagal memuat data</div>`;
    }
  }

  function timeSince(date) {
    const seconds = Math.floor((new Date() - date) / 1000);
    const intervals = [
      [31536000, "tahun"], [2592000, "bulan"], [86400, "hari"],
      [3600, "jam"], [60, "menit"]
    ];
    for (const [secs, unit] of intervals) {
      const count = Math.floor(seconds / secs);
      if (count >= 1) return count === 1 ? `1 ${unit} lalu` : `${count} ${unit} lalu`;
    }
    return "baru saja";
  }

  // Filter kategori
  document.getElementById("kategori").addEventListener("change", function () {
    const val = this.value;
    document.querySelectorAll(".notifikasi-item").forEach(item => {
      item.style.display = 
        val === "semua" || item.dataset.category === val ? "block" : "none";
    });
  });

  // Auto refresh
  loadNotifikasi();
  setInterval(loadNotifikasi, 10000); // setiap 10 detik
</script>
</body>
</html>
