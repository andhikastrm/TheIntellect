<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notifikasi Kucing</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body class="page-notifikasi">
    <nav id="sidebar">
      <!-- sidebar lo tetap -->
      <ul>
        <li>
          <span class="logo"
            ><img
              src="../../assets/images/petricord-logo.svg"
              style="width: 100px"
          /></span>
          <button onclick="toggleSidebar()" id="toggle-btn">
            <img src="../../assets/icons/double-arrow-right-svgrepo-com.svg" />
          </button>
        </li>
        <li>
          <a href="perangkat.html"
            ><img
              src="../../assets/icons/devices-svgrepo-com-outline.svg"
            /><span>Perangkat</span></a
          >
        </li>
        <li class="active">
          <a href="#"
            ><img
              src="../../assets/icons/notification-alert-2-svgrepo-com.svg"
            /><span>Notifikasi</span></a
          >
        </li>
        <li>
          <a href="riwayat.html"
            ><img src="../../assets/icons/log.svg" /><span>Riwayat</span></a
          >
        </li>
        <li>
          <a href="jurnal-hewan.html"
            ><img src="../../assets/icons/health-svgrepo-com.svg" /><span
              >Jurnal Hewan</span
            ></a
          >
        </li>
        <li>
          <a href="profil.html"
            ><img src="../../assets/icons/user-svgrepo-com.svg" /><span
              >Profil</span
            ></a
          >
        </li>
      </ul>
    </nav>

    <main class="p-8 min-h-screen">
      <div class="paw-bg">
        <img src="../../assets/images/paw.png" class="paw deco paw-1" alt="" />
        <img src="../../assets/images/paw.png" class="paw deco paw-2" alt="" />
      </div>

      <div class="header-section">
        <h2>Notifikasi Terkini</h2>
        <div class="header-controls">
          <select id="kategori">
            <option value="semua">Semua Kategori</option>
            <option value="peringatan">Peringatan</option>
            <option value="informasi">Informasi</option>
          </select>
        </div>
      </div>

      <div class="max-w-7xl mx-auto content-wrap">
        <div class="notifikasi-container" id="notifikasi-container">
          <!-- Notifikasi akan di-inject otomatis -->
        </div>

        <div id="empty-state" class="text-center py-20 hidden">
          <i class="ri-emotion-happy-line big-emoji"></i>
          <p class="empty-title">Semua aman!</p>
          <p class="empty-sub">Belum ada aktivitas terdeteksi saat ini.</p>
        </div>
      </div>
    </main>
    <script type="module" src="/js/notifikasi.js"></script>

    <script>
      // Toggle sidebar – versi anti-gagal
      document.addEventListener("DOMContentLoaded", () => {
        const toggleButton = document.getElementById("toggle-btn");
        const sidebar = document.getElementById("sidebar");

        if (!toggleButton || !sidebar) {
          console.warn("Tombol atau sidebar nggak ketemu!");
          return;
        }

        toggleButton.addEventListener("click", () => {
          sidebar.classList.toggle("close");
          toggleButton.classList.toggle("rotate");

          // optional: simpan status ke localStorage biar ingat saat refresh
          localStorage.setItem(
            "sidebarClosed",
            sidebar.classList.contains("close")
          );
        });

        // ingat posisi terakhir saat reload
        if (
          localStorage !== "undefined" &&
          localStorage.getItem("sidebarClosed") === "true"
        ) {
          sidebar.classList.add("close");
          toggleButton.classList.add("rotate");
        }
      });
    </script>
    <script>
      // Ensure main margin matches sidebar initial state
      document.addEventListener("DOMContentLoaded", () => {
        const sidebar = document.getElementById("sidebar");
        const main = document.querySelector("main");
        // keep main layout static; sidebar toggles visually only
        if (main && sidebar) {
          // no-op: layout handled by CSS
        }
      });

      // Mapping ikon & judul cerdas
      const behaviorConfig = {
        kejang: {
          icon: "ri-alert-fill",
          title: "Gejala Kejang Terdeteksi!",
          color: "red",
          critical: true,
        },
        muntah: {
          icon: "ri-emotion-unhappy-line",
          title: "Kucing Muntah!",
          color: "red",
          critical: true,
        },
        makan: {
          icon: "ri-restaurant-line",
          title: "Kucingmu sedang makan!",
          color: "green",
        },
        minum: {
          icon: "ri-cup-line",
          title: "Kucing Sedang Minum",
          color: "blue",
        },
        tidur: {
          icon: "ri-hotel-bed-line",
          title: "Kucing Tidur Nyenyak",
          color: "purple",
        },
        bermain: {
          icon: "ri-gamepad-line",
          title: "Kucing Sedang Bermain",
          color: "yellow",
        },
        "buang air": {
          icon: "ri-recycle-line",
          title: "Kucing Buang Air",
          color: "orange",
        },
        grooming: {
          icon: "ri-sparkling-2-line",
          title: "Kucing Membersihkan Diri",
          color: "pink",
        },
        default: {
          icon: "ri-paw-line",
          title: (b) => `${b} Terdeteksi`,
          color: "gray",
        },
      };

      async function loadNotifikasi() {
        try {
          const res = await fetch(
            "http://localhost:8000/api/cats/activities/latest-by-behavior"
          );
          if (!res.ok) throw new Error("Server mati bro");
          const data = await res.json();
          const logs = data.activities || [];

          // Only keep relevant behaviors for notifications
          const allowedBehaviors = ["kejang", "muntah", "makan", "buang air"];
          const filtered = logs.filter((l) => {
            const b = (l.behavior || "").toLowerCase();
            return allowedBehaviors.includes(b);
          });

          const container = document.getElementById("notifikasi-container");
          const emptyState = document.getElementById("empty-state");
          container.innerHTML = "";
          container.className = "notifikasi-container";

          if (!filtered || filtered.length === 0) {
            container.innerHTML = "";
            if (emptyState) emptyState.classList.remove("hidden");
          } else {
            if (emptyState) emptyState.classList.add("hidden");
            // lalu render notifikasi...
          }

          // Urutkan: critical dulu, lalu terbaru
          filtered
            .sort((a, b) => {
              const aCrit = ["kejang", "muntah"].includes(
                (a.behavior || "").toLowerCase()
              );
              const bCrit = ["kejang", "muntah"].includes(
                (b.behavior || "").toLowerCase()
              );
              if (aCrit && !bCrit) return -1;
              if (!aCrit && bCrit) return 1;
              return new Date(b.timestamp) - new Date(a.timestamp);
            })
            .forEach((log) => {
              const behavior = log.behavior.toLowerCase();
              const isCritical = ["kejang", "muntah"].includes(behavior);

              // Judul cerdas
              let title = log.behavior;
              if (behavior === "kejang") title = "Gejala kejang terdeteksi!";
              else if (behavior === "muntah") title = "Kucing muntah!";
              else if (behavior === "makan") title = "Kucingmu sedang makan!";
              else if (behavior === "buang air") title = "Kucing buang air";
              else title = `${log.behavior} terdeteksi`;

              const timeAgo = timeSince(new Date(log.timestamp));

              const card = document.createElement("div");
              card.className = "notifikasi-item";
              card.dataset.category = isCritical ? "peringatan" : "informasi";
              if (isCritical) card.classList.add("critical");

              card.innerHTML = `
            <div class="notifikasi-content">
              <div class="notifikasi-content-header">
                <div style="display:flex; align-items:center; gap:12px;">
                  <div class="badge-icon large">
                    <i class="ri-${
                      isCritical ? "alert-fill" : "checkbox-circle-fill"
                    }"></i>
                  </div>
                  <div>
                    <div class="notifikasi-badge">${
                      isCritical ? "PERINGATAN" : "INFORMASI"
                    }</div>
                    <h3 class="notifikasi-title">${title}</h3>
                  </div>
                </div>
                <span class="notifikasi-time">${timeAgo}</span>
              </div>

              <div class="notifikasi-description"><i class="ri-device-line"></i> <span>${
                log.custom_name || "Kamera Utama"
              }</span></div>

              <div class="mt-3">
                <span class="notifikasi-description">Confidence:</span>
                <span class="notifikasi-title"> ${log.confidence.toFixed(
                  1
                )}%</span>
              </div>
            </div>
          `;

              container.appendChild(card);

              // ensure empty state is hidden once we append any notification
              if (emptyState) emptyState.classList.add("hidden");

              // Alarm cuma sekali
              if (isCritical) {
                if (!localStorage.getItem("alerted_" + log.id)) {
                  new Audio(
                    "https://assets.mixkit.co/sfx/preview/mixkit-alarm-tone-1077.mp3"
                  )
                    .play()
                    .catch(() => {});
                  localStorage.setItem("alerted_" + log.id, "true");
                }
              }
            });
        } catch (e) {
          console.error("Error:", e);
          // hide the empty state when showing an error
          const emptyState = document.getElementById("empty-state");
          if (emptyState) emptyState.classList.add("hidden");
          document.getElementById(
            "notifikasi-container"
          ).innerHTML = `<div class="text-center py-10 text-red-600">Gagal memuat data</div>`;
        }
      }

      function timeSince(date) {
        const seconds = Math.floor((new Date() - date) / 1000);
        const intervals = [
          [31536000, "tahun"],
          [2592000, "bulan"],
          [86400, "hari"],
          [3600, "jam"],
          [60, "menit"],
        ];
        for (const [secs, unit] of intervals) {
          const count = Math.floor(seconds / secs);
          if (count >= 1)
            return count === 1 ? `1 ${unit} lalu` : `${count} ${unit} lalu`;
        }
        return "baru saja";
      }

      // Filter kategori
      document
        .getElementById("kategori")
        .addEventListener("change", function () {
          const val = this.value;
          const items = Array.from(
            document.querySelectorAll(".notifikasi-item")
          );
          items.forEach((item) => {
            item.style.display =
              val === "semua" || item.dataset.category === val
                ? "block"
                : "none";
          });
          // if after filtering there are no visible items, show empty state
          const anyVisible = items.some((i) => i.style.display !== "none");
          const emptyState = document.getElementById("empty-state");
          if (emptyState) {
            if (!anyVisible) emptyState.classList.remove("hidden");
            else emptyState.classList.add("hidden");
          }
        });

      // Auto refresh
      loadNotifikasi();
      setInterval(loadNotifikasi, 10000); // setiap 10 detik
    </script>
  </body>
</html>
