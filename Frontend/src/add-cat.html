<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Petricord - Tambah Peliharaan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body {background: linear-gradient(135deg, #f8f9fa, #e9ecef);min-height: 100vh;font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;margin: 0;}
    .paw-bg {position: fixed;top: 50%;left: 50%;transform: translate(-50%, -50%);font-size: 32rem;color: #dfe6e9;opacity: 0.25;z-index: -1;pointer-events: none;}
    .logo {font-size: 3.5rem;font-weight: 900;color: #2d3436;letter-spacing: -3px;}
    .card-form {background: white;border-radius: 32px;box-shadow: 0 30px 80px rgba(0,0,0,0.2);padding: 60px 50px;max-width: 560px;margin: 20px auto;}
    .btn-simpan {background: linear-gradient(45deg, #b8860b, #d4a017);border: none;border-radius: 50px;padding: 18px;font-weight: 700;font-size: 1.2rem;transition: all 0.3s ease;}
    .btn-simpan:hover {background: linear-gradient(45deg, #a67c00, #b8860b);transform: translateY(-5px);box-shadow: 0 15px 30px rgba(184,134,11,0.4);}
    .profile-pic {width: 130px;height: 130px;object-fit: cover;border: 6px solid #d4a017;border-radius: 50%;transition: all 0.4s ease;}
    .upload-area:hover .profile-pic {transform: scale(1.08);box-shadow: 0 10px 30px rgba(212,160,23,0.4);}
    .form-control-lg.rounded-pill, .form-select-lg.rounded-pill {padding: 14px 20px;font-size: 1.1rem;}
  </style>
</head>

<body class="d-flex align-items-center justify-content-center position-relative min-vh-100">
  <div class="paw-bg"><i class="fas fa-paw"></i></div>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-11 col-md-8 col-lg-6">
        <div class="card-form text-center">

          <h1 class="logo mb-4">Petricord</h1>
          <p class="text-muted fs-5 mb-2 fw-medium">Selamat bergabung, <span id="userName">Cordian</span>!</p>
          <p class="text-muted mb-5 lead">Tambahkan kucing kesayanganmu untuk mulai memantau</p>

          <div class="mb-5 upload-area" onclick="document.getElementById('fotoInput').click()">
            <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTMwIiBoZWlnaHQ9IjEzMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMzMzIj48L3JlY3Q+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiNmZmYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj5NZW93PC90ZXh0Pjwvc3ZnPg==" 
                 alt="Foto Kucing" class="profile-pic shadow-lg" id="preview">
            <input type="file" id="fotoInput" accept="image/*" class="d-none">
            <div class="mt-3">
              <small class="text-warning fw-medium">
                <i class="fas fa-camera me-1"></i> Klik foto untuk upload
              </small>
            </div>
          </div>

          <form id="addCatForm" class="text-start">
            <div class="mb-4">
              <label class="form-label fw-semibold">Nama Kucing</label>
              <input type="text" class="form-control form-control-lg rounded-pill" id="nama" placeholder="Misal: Momo" required>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Ras Kucing</label>
              <select class="form-select form-select-lg rounded-pill" id="ras">
                <option value="" disabled selected>Pilih ras</option>
                <option>Persia</option>
                <option>Maine Coon</option>
                <option>Anggora</option>
                <option>Kampung</option>
                <option>Ragdoll</option>
                <option>Lainnya</option>
              </select>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Tanggal Lahir</label>
              <input type="text" class="form-control form-control-lg rounded-pill" id="usia" placeholder="YYYY/MM (contoh: 2023/06)" required>
            </div>
            <div class="mb-5">
              <label class="form-label fw-semibold">Berat Badan (kg)</label>
              <input type="number" step="0.1" class="form-control form-control-lg rounded-pill" id="berat" placeholder="Contoh: 4.5" required>
            </div>

            <button type="submit" class="btn btn-simpan w-100 shadow-lg text-white">
              Simpan & Lanjut ke Dashboard
            </button>
          </form>

        </div>
      </div>
    </div>
  </div>

  <!-- SCRIPT FINAL — SUDAH 100% BENAR & JALAN DI PROYEK KAMU -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCTwQ8IlGP_N_-fALBqu5269QlvJ7G8Mrk",
      authDomain: "petricord-f8c54.firebaseapp.com",
      projectId: "petricord-f8c54",
      storageBucket: "petricord-f8c54.firebasestorage.app",
      messagingSenderId: "814472267558",
      appId: "1:814472267558:web:d97ddfd93757a7fe5f63e7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Preview foto
    document.getElementById("fotoInput").addEventListener("change", (e) => {
      if (e.target.files?.[0]) {
        document.getElementById("preview").src = URL.createObjectURL(e.target.files[0]);
      }
    });

    // Cek login & submit form
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        location.href = "/login.html";
        return;
      }

      // Tampilkan nama user
      document.getElementById("userName").textContent = user.displayName?.split(" ")[0] || "Cordian";

      // Submit form
      document.getElementById("addCatForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const token = await user.getIdToken();
        const formData = new FormData();

        formData.append("nama", document.getElementById("nama").value.trim() || "Meong");
        formData.append("ras", document.getElementById("ras").value || "Kampung");
        formData.append("usia", document.getElementById("usia").value.trim());
        formData.append("berat_badan", document.getElementById("berat").value || "3.5");
        if (document.getElementById("fotoInput").files[0]) {
          formData.append("foto", document.getElementById("fotoInput").files[0]);
        }

        try {
          const res = await fetch("/api/cats/", {
            method: "POST",
            headers: { "Authorization": `Bearer ${token}` },
            body: formData
          });

          if (res.ok) {
            await Swal.fire({
              icon: "success",
              title: "Sukses!",
              text: "Kucing berhasil ditambahkan!",
              timer: 1500,
              showConfirmButton: false
            });
            // GANTI SESUAI NAMA FILE DASHBOARD KAMU!
            window.location.href = "/owner-dashboard.html";  // atau /user-dashboard.html
          } else {
            const err = await res.json();
            Swal.fire("Gagal", err.detail || "Gagal menyimpan kucing", "error");
          }
        } catch (err) {
          console.error(err);
          Swal.fire("Error", "Koneksi gagal atau server mati", "error");
        }
      });
    });
  </script>
</body>
</html>
