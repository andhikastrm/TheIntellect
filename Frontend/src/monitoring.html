<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petricord - Monitoring Live</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>
  <style>
    body, html { margin:0; padding:0; height:100%; background:#000; overflow:hidden; }
    #video { width:100%; height:100%; object-fit:cover; }

    /* TOGGLE PANAH MAJU/MUNDUR */
    .toggle-direction {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); border: 3px solid #f59e0b;
      border-radius: 50px; padding: 12px 30px;
      box-shadow: 0 0 40px rgba(251,146,60,0.8);
    }
    .toggle-direction i { font-size: 3rem; color: #fff; }

    /* SWITCH KIRI-KANAN (ikon kamera) */
    .switch-cam {
      position: absolute; bottom: 30px; right: 30px;
      background: rgba(0,0,0,0.8); border: 3px solid #f59e0b;
      width: 70px; height: 70px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 40px rgba(251,146,60,0.8);
      cursor: pointer;
    }
    .switch-cam i { font-size: 2.5rem; color: #fff; }

    /* LABEL DETEKSI BESAR */
    #detectionLabel {
      position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.9); border: 5px solid #f59e0b;
      padding: 20px 50px; border-radius: 40px;
      font-size: 3rem; font-weight: bold; color: #59ff0b;
      text-shadow: 0 0 30px #00ff00;
      opacity: 0; transition: opacity 0.6s ease, transform 0.6s ease;
      box-shadow: 0 0 50px rgba(0, 255, 0, 0.7);
    }
    #detectionLabel.show {
      opacity: 1; transform: translateX(-50%) translateY(0);
    }

    /* Device ID kecil */
    #deviceInfo {
      position: absolute; top: 20px; left: 20px;
      background: rgba(0,0,0,0.7); padding: 10px 20px;
      border-radius: 20px; color: #f59e0b; font-weight: bold;
      font-size: 1.1rem; border: 2px solid #f59e0b;
    }
  </style>
</head>
<body>

  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas" class="hidden"></canvas>

  <!-- LABEL DETEKSI BESAR -->
  <div id="detectionLabel">
    <span id="catName">KUCING</span> → <span id="behavior">MENUNGGU...</span>
    <div class="text-5xl mt-3" id="confidence">0%</div>
  </div>

  <!-- DEVICE ID -->
  <div id="deviceInfo">Device: <span id="deviceId" class="text-green-400">Loading...</span></div>

  <!-- TOGGLE PANAH MAJU / MUNDUR -->
  <div class="toggle-direction" id="directionToggle">
    <i class="ri-arrow-right-s-line" id="arrowIcon"></i>
  </div>

  <!-- SWITCH KAMERA KIRI/KANAN -->
  <div class="switch-cam" id="switchCam">
    <i class="ri-camera-switch-line"></i>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const label = document.getElementById('detectionLabel');
    const catNameEl = document.getElementById('catName');
    const behaviorEl = document.getElementById('behavior');
    const confidenceEl = document.getElementById('confidence');
    const deviceIdEl = document.getElementById('deviceId');
    const arrowIcon = document.getElementById('arrowIcon');
    const directionToggle = document.getElementById('directionToggle');
    const switchCamBtn = document.getElementById('switchCam');

    let stream = null;
    let facingMode = "environment";
    let isForward = true;
    let isProcessing = false;

    // Device Serial
    let deviceSerial = localStorage.getItem("my_device_serial") || 
                       "DEV-" + Date.now().toString(36).toUpperCase();
    localStorage.setItem("my_device_serial", deviceSerial);
    deviceIdEl.textContent = deviceSerial;

    // Toggle Maju/Mundur
    directionToggle.onclick = () => {
      isForward = !isForward;
      arrowIcon.className = isForward ? "ri-arrow-right-s-line" : "ri-arrow-left-s-line";
    };

    // Switch Kamera
    switchCamBtn.onclick = () => {
      facingMode = facingMode === "user" ? "environment" : "user";
      startCamera();
    };

    async function detect() {
      if (!video.videoWidth || isProcessing) return;
      isProcessing = true;

      canvas.width = video.videoWidth;
      canvas.height = video.height;
      ctx.drawImage(video, 0, 0);

      canvas.toBlob(async (blob) => {
        const form = new FormData();
        form.append("image", blob, "frame.jpg");

        try {
          const res = await fetch("http://127.0.0.1:8000/api/cats/detect-behavior", {
            method: "POST",
            headers: { "X-Device-Serial": deviceSerial },
            body: form
          });
          const data = await res.json();

          if (data.success && data.confidence > 0.4) {
            label.classList.add("show");
            catNameEl.textContent = data.cat_name || "KUCING";
            behaviorEl.textContent = data.habit.toUpperCase();
            confidenceEl.textContent = Math.round(data.confidence * 100) + "%";
          } else {
            label.classList.remove("show");
          }
        } catch (e) {
          label.classList.remove("show");
        } finally {
          isProcessing = false;
        }
      }, "image/jpeg", 0.8);
    }

    function startCamera() {
      if (stream) stream.getTracks().forEach(t => t.stop());
      navigator.mediaDevices.getUserMedia({ video: { facingMode } })
        .then(s => {
          stream = s;
          video.srcObject = stream;
          video.onloadedmetadata = () => video.play();
        });
    }

    // Jalankan
    startCamera();
    setInterval(detect, 1000);
  </script>
</body>
</html>
