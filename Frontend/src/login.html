<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selamat datang kembali!</title>

  <!-- Script Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <!-- Link Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Link Favicon -->
  <link rel="icon" href="/assets/images/petricord-logo.svg" type="image/x-icon" />
</head>

<body>
  <header>
    <nav class="navbar navbar-expand-lg fixed-top">
      <div class="container-fluid d-flex align-items-center justify-content-between">
        <!-- Brand -->
        <a class="navbar-brand" href="index.html">
          <img src="./assets/images/petricord-logo.svg" height="30" />
        </a>
        <div class="d-flex ms-lg-auto mt-lg-0">
          <a class="btn backbtn" onclick="history.back()">
            <img class="back-icon" src="./assets/icons/back-arrow-svgrepo-com.svg" alt="Back" />
          </a>
        </div>
      </div>
    </nav>
  </header>

  <main class="main">
    <div class="container-bg">
      <img src="./assets/images/paw.png" class="paw paw1" alt="" />
      <img src="./assets/images/paw.png" class="paw paw2" alt="" />
    </div>

    <div class="main-container">
      <div class="row welcoming">
        <p>Selamat datang kembali, Cordian!</p>
      </div>
      <div class="row container-login">
        <div class="login-heading">
          <h5>Masuk dengan email</h5>
        </div>
        <div class="login-form">
          <input type="email" id="email" placeholder="Email" required />
          <div class="password-wrapper">
            <input type="password" id="pass" placeholder="Password" required />
            <span class="toggle-password" onclick="togglePass()">
              <img src="./assets/icons/hide-svgrepo-com.svg" id="eyeIcon" alt="Show/Hide" />
            </span>
          </div>
          <button class="withemail" onclick="loginWithEmail()">
            Masuk dengan email
          </button>
          <div class="form-divider">
            <span>atau</span>
          </div>
          <button class="google" onclick="signInWithGoogle()">
            Lanjutkan dengan Google
          </button>
          <p>
            Belum punya akun?
            <a href="register.html" style="color: #7f620b; font-weight: 500">Daftar sekarang</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <!-- Link custom JS -->
  <script type="module" src="/js/login.js"></script>

  <script>
    // GUNAKAN PORT YANG BENAR-BENAR KAMU PAKAI
    const baseUrl = "http://127.0.0.1:8000"; // Backend FastAPI
    // const baseUrl = "http://localhost:8000"; // kalau pakai ini juga boleh

    const firebaseConfig = {
      apiKey: "AIzaSyCTwQ8IlGP_N_-fALBqu5269QlvJ7G8Mrk",
      authDomain: "petricord-f8c54.firebaseapp.com",
      projectId: "petricord-f8c54",
      storageBucket: "petricord-f8c54.firebasestorage.app",
      messagingSenderId: "814472267558",
      appId: "1:814472267558:web:d97ddfd93757a7fe5f63e7",
    };

    // Firebase v9 Compat (sama kayak v8 tapi lebih baru & nggak bikin warning)
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();

    // Scope tambahan biar ambil nama + foto (optional)
    provider.addScope("profile");
    provider.addScope("email");


    // ==================== LOGIN GOOGLE (POPUP) ====================
    async function signInWithGoogle() {
      try {
        const result = await auth.signInWithPopup(provider);
        const token = await result.user.getIdToken();
        await syncToBackend(token);
      } catch (err) {
        // Error biasa: user cancel, popup blocked, dll
        if (err.code === "auth/popup-blocked") {
          alert("Popup diblokir browser. Izinkan popup untuk situs ini ya!");
        } else if (err.code === "auth/popup-closed-by-user") {
          console.log("User batalin login");
        } else {
          alert("Login Google gagal: " + err.message);
        }
        console.error(err);
      }
    }

    // ==================== SYNC TOKEN KE BACKEND ====================
    async function syncToBackend(firebaseToken) {
      try {
        const resp = await fetch(`${baseUrl}/api/auth/google-login`, {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json",
            // "Authorization": `Bearer ${firebaseToken}`
          },
          body: JSON.stringify({ token: firebaseToken }),
        });

        // Kalau backend error 4xx/5xx
        if (!resp.ok) {
          const err = await resp.text();
          throw new Error(`HTTP ${resp.status}: ${err}`);
        }

        const data = await resp.json();

        if (data.success && data.access_token) {
          localStorage.setItem("access_token", data.access_token);
          localStorage.setItem("user_name", data.user.nama || "Cordian");
          localStorage.setItem("user_email", data.user.email || "");

          alert(
            `Selamat datang${data.user.nama ? ", " + data.user.nama : ""}!`
          );

          // KALAU KAMU BUKA DARI localhost:8080 (Vite/Live Server)
          // pindah ke dashboard yang diserve FastAPI
          window.location.href = "/pages/owner/perangkat";

          // Kalau semua file di-serve dari FastAPI (127.0.0.1:8000), pakai ini aja:
          // window.location.href = "/pages/dashboard/owner-dashboard.html";
        } else {
          alert("Gagal sync: " + (data.detail || JSON.stringify(data)));
        }
      } catch (err) {
        console.error("Sync ke backend gagal:", err);
        alert("Koneksi ke server gagal atau token ditolak");
      }
    }

    // Show / Hide Password (tetap jalan)
    function togglePass() {
      const pass = document.getElementById("pass");
      const eye = document.getElementById("eyeIcon");
      if (pass.type === "password") {
        pass.type = "text";
        eye.src = "./assets/icons/show-svgrepo-com.svg";
      } else {
        pass.type = "password";
        eye.src = "./assets/icons/hide-svgrepo-com.svg";
      }
    }

    // Validasi Real-time
    document.getElementById("email").addEventListener("input", function () {
      const email = this.value.trim();
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (email === "") {
        this.classList.remove("input-valid", "input-invalid");
      } else if (emailRegex.test(email)) {
        this.classList.remove("input-invalid");
        this.classList.add("input-valid");
      } else {
        this.classList.remove("input-valid");
        this.classList.add("input-invalid");
      }
    });

    document.getElementById("pass").addEventListener("input", function () {
      const pass = this.value;
      if (pass.length === 0) {
        this.classList.remove("input-valid", "input-invalid");
      } else if (pass.length >= 6) {
        this.classList.remove("input-invalid");
        this.classList.add("input-valid");
      } else {
        this.classList.remove("input-valid");
        this.classList.add("input-invalid");
      }
    });

    // Login dengan backend API langsung
    async function loginWithEmail() {
      const email = document.getElementById("email");
      const pass = document.getElementById("pass");

      // Cek terakhir sebelum login
      if (
        !email.classList.contains("input-valid") ||
        !pass.classList.contains("input-valid")
      ) {
        alert("Mohon perbaiki email atau password terlebih dahulu");
        return;
      }

      try {
        const response = await fetch(`${baseUrl}/api/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: email.value.trim(),
            password: pass.value
          })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          localStorage.setItem("access_token", data.access_token);
          localStorage.setItem("user_name", data.user.nama || "Cordian");
          localStorage.setItem("user_email", data.user.email || "");

          alert(`Selamat datang${data.user.nama ? ", " + data.user.nama : ""}!`);
          window.location.href = "/pages/owner/perangkat";
        } else {
          alert("Email atau password salah!");
          email.classList.add("input-invalid");
          pass.classList.add("input-invalid");
        }
      } catch (err) {
        alert("Koneksi ke server gagal: " + err.message);
        email.classList.add("input-invalid");
        pass.classList.add("input-invalid");
      }
    }
  </script>
</body>

</html>
