<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Petricord Live</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body, html { margin:0; padding:0; height:100%; overflow:hidden; background:#000; }
    #overlay {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.85); padding: 8px 20px; border-radius: 16px;
      border: 3px solid #f59e0b; box-shadow: 0 0 25px rgba(251,146,60,0.7);
      font-family: system-ui, sans-serif; text-align: center;
      animation: glow 2s infinite alternate;
    }
    @keyframes glow {
      from { box-shadow: 0 0 20px rgba(251,146,60,0.6); }
      to { box-shadow: 0 0 40px rgba(251,146,60,1); }
    }
  </style>
</head>
<body class="h-full">

  <video id="video" autoplay muted playsinline class="w-full h-full object-cover"></video>
  <canvas id="canvas" class="hidden"></canvas>

  <!-- Overlay SUPER KECIL — cuma muncul kalau ada deteksi -->
  <div id="overlay" class="hidden text-sm">
    <div id="habit" class="font-bold text-amber-400"></div>
    <div id="confidence" class="text-green-400 font-bold"></div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const habitEl = document.getElementById('habit');
    const confEl = document.getElementById('confidence');

    // Device Serial
    let deviceSerial = localStorage.getItem("my_device_serial") || 
                       "DEV-" + Date.now().toString(36).toUpperCase();
    localStorage.setItem("my_device_serial", deviceSerial);

    let isProcessing = false;

    async function detect() {
      if (!video.videoWidth || isProcessing) return;
      isProcessing = true;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);

      canvas.toBlob(async (blob) => {
        const form = new FormData();
        form.append("image", blob, "frame.jpg");

        try {
          const res = await fetch("http://127.0.0.1:8000/api/cats/detect-behavior", {
            method: "POST",
            headers: { "X-Device-Serial": deviceSerial },
            body: form
          });
          const data = await res.json();

          if (data.success && data.confidence > 0.3) { // hanya tampilkan kalau yakin
            overlay.classList.remove("hidden");
            habitEl.textContent = data.habit.toUpperCase();
            confEl.textContent = Math.round(data.confidence * 100) + "%";
          } else {
            overlay.classList.add("hidden");
          }
        } catch (e) {
          overlay.classList.add("hidden");
        } finally {
          isProcessing = false;
        }
      }, "image/jpeg", 0.8);
    }

    // START KAMERA + DETEKSI
    navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: "environment" } 
    }).then(stream => {
      video.srcObject = stream;
      video.onloadedmetadata = () => {
        video.play();
        setInterval(detect, 1200); // cepat banget
      };
    }).catch(() => {
      document.body.innerHTML = "<div class='text-white text-center pt-20 text-3xl'>Kamera tidak diizinkan</div>";
    });
  </script>
</body>
</html>
